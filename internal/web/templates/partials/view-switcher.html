{{ define "view-switcher" }}
<!-- View switcher: one dropdown for all views, stays narrow however many views exist -->
<div class="dropdown dropdown-end flex-1 md:flex-none min-w-0">
    <div tabindex="0" role="button"
        class="btn btn-sm md:btn-xs min-h-11 md:min-h-0 w-full md:w-auto justify-between gap-2 text-xs border-base-content/20"
        :aria-label="$t('shift_plans.view.view_mode') + ': ' + $t(viewModes.find(m => m.id === viewMode).labelKey)"
        aria-haspopup="menu">
        <span class="flex items-center gap-1.5 min-w-0">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 md:h-3.5 md:w-3.5 shrink-0" fill="none"
                viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    :d="viewModes.find(m => m.id === viewMode).icon" />
            </svg>
            <span class="truncate" x-text="$t(viewModes.find(m => m.id === viewMode).labelKey)"></span>
        </span>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 shrink-0" fill="none" viewBox="0 0 24 24"
            stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
    </div>
    <ul tabindex="0" role="menu"
        class="dropdown-content z-[10] menu p-2 shadow bg-base-100 rounded-box w-full min-w-52 md:w-56">
        <template x-for="mode in viewModes" :key="mode.id">
            <li role="none">
                <a role="menuitemradio" class="min-h-11 md:min-h-0"
                    :class="viewMode === mode.id ? 'menu-active' : ''"
                    :aria-checked="viewMode === mode.id"
                    @click="setViewMode(mode.id); document.activeElement?.blur()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" :d="mode.icon" />
                    </svg>
                    <span x-text="$t(mode.labelKey)"></span>
                </a>
            </li>
        </template>
    </ul>
</div>
{{ end }}
