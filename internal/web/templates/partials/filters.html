{{ define "filters" }}
<div class="card-body relative z-20 p-2.5 md:p-3 gap-2" x-data="{ isFilterExpanded: window.innerWidth >= 768 }" x-init="window.addEventListener('resize', () => { if (!isFilterExpanded && window.innerWidth >= 768) isFilterExpanded = true; })">
    <!-- Mobile header: toggle, active count, clear. Hidden from md up, where the filters are always visible. -->
    <div class="flex items-center justify-between gap-2 md:hidden">
        <button type="button" class="flex items-center gap-2 min-h-11 flex-1 text-left"
                @click="isFilterExpanded = !isFilterExpanded"
                :aria-expanded="isFilterExpanded">
            <h2 class="text-base font-semibold" x-text="$t('shift_plans.view.filter.title')"></h2>
            <span x-show="filterManager.hasActiveFilters()" class="badge badge-primary badge-sm" x-text="filterManager.getActiveFilterCount()"></span>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-auto transition-transform duration-200"
                 :class="{ 'rotate-180': isFilterExpanded }" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
        </button>
        <button type="button" class="btn btn-ghost btn-sm min-h-11"
                x-show="filterManager.hasActiveFilters()"
                @click="filterManager.clearFilters()"
                x-text="$t('shift_plans.view.filter.clear')"></button>
    </div>

    <!-- Filter controls: 2 columns on mobile, one row on desktop. Labels are screen-reader only; the control text names the filter. -->
    <div x-show="isFilterExpanded">
        <div class="grid grid-cols-2 lg:grid-cols-[repeat(4,minmax(0,1fr))_auto] gap-2 items-center">
            <!-- Shift types -->
            <div class="dropdown min-w-0">
                <label class="sr-only" x-text="$t('shift_plans.view.filter.types')"></label>
                <div tabindex="0" role="button"
                     class="select select-bordered w-full min-h-11 lg:min-h-0 lg:h-10 flex items-center"
                     :class="{ 'select-primary': filterManager.selectedTypes.length > 0 }"
                     :aria-label="$t('shift_plans.view.filter.types')">
                    <span class="truncate" x-text="filterManager.selectedTypes.length ?
                        $t('shift_plans.view.filter.n_types_selected', { count: filterManager.selectedTypes.length }) :
                        $t('shift_plans.view.filter.all_types')"></span>
                </div>
                <div tabindex="0" class="dropdown-content z-[10] menu p-2 mt-1 shadow bg-base-100 rounded-box w-full min-w-64 max-h-64 overflow-y-auto flex-nowrap">
                    <div class="flex flex-col gap-1">
                        <label class="flex items-center justify-start gap-3 text-left cursor-pointer hover:bg-base-200 rounded-lg px-3 min-h-11">
                            <input type="checkbox"
                                   class="checkbox checkbox-sm"
                                   :checked="filterManager.selectedTypes.length === shiftTypes.length"
                                   @change="filterManager.toggleAllTypes(shiftTypes.map(t => t.id))" />
                            <span class="label-text text-left font-medium" x-text="$t('shift_plans.view.filter.all_types')"></span>
                        </label>
                        <div class="divider my-0 h-px"></div>
                        <template x-for="type in shiftTypes" :key="type.id">
                            <label class="flex items-center justify-start gap-3 text-left cursor-pointer hover:bg-base-200 rounded-lg px-3 min-h-11">
                                <input type="checkbox"
                                       class="checkbox checkbox-sm"
                                       :checked="filterManager.selectedTypes.includes(type.id)"
                                       @change="filterManager.toggleType(type.id)" />
                                <span class="label-text text-left"
                                      x-text="plan.is_multilingual ? ($locale() === 'de' ? type.title_de : type.title_en) : type.title_en">
                                </span>
                            </label>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Day -->
            <div class="min-w-0">
                <label class="sr-only" for="filter-day" x-text="$t('shift_plans.view.filter.days')"></label>
                <select id="filter-day" class="select select-bordered w-full min-h-11 lg:min-h-0 lg:h-10"
                        x-model="filterManager.selectedDay"
                        :class="{ 'select-primary': filterManager.selectedDay }">
                    <option value="" x-text="$t('shift_plans.view.filter.all_days')"></option>
                    <template x-for="day in filterManager.getAvailableDays(shiftTypes)" :key="day">
                        <option :value="day" x-text="formatDate(day)"></option>
                    </template>
                </select>
            </div>

            <!-- Status -->
            <div class="min-w-0">
                <label class="sr-only" for="filter-status" x-text="$t('shift_plans.view.filter.status')"></label>
                <select id="filter-status" class="select select-bordered w-full min-h-11 lg:min-h-0 lg:h-10"
                        x-model="filterManager.selectedStatus"
                        :class="{ 'select-primary': filterManager.selectedStatus !== 'all' }">
                    <option value="all" x-text="$t('shift_plans.view.filter.status_all')"></option>
                    <option value="empty" x-text="$t('shift_plans.view.filter.status_empty')"></option>
                    <option value="critical" x-text="$t('shift_plans.view.filter.status_critical')"></option>
                    <option value="not_full" x-text="$t('shift_plans.view.filter.status_not_full')"></option>
                    <option value="full" x-text="$t('shift_plans.view.filter.status_full')"></option>
                    <option value="overbooked" x-text="$t('shift_plans.view.filter.status_overbooked')"></option>
                </select>
            </div>

            <!-- Name search with inline clear -->
            <div class="relative min-w-0">
                <label class="sr-only" for="filter-search" x-text="$t('shift_plans.view.filter.search')"></label>
                <input id="filter-search" type="search"
                       class="input input-bordered w-full min-h-11 lg:min-h-0 lg:h-10 pr-9 [&::-webkit-search-cancel-button]:hidden"
                       :class="{ 'input-primary': filterManager.searchQuery.trim() }"
                       x-model="filterManager.searchQuery"
                       :placeholder="$t('shift_plans.view.filter.search_placeholder')" />
                <button type="button" class="btn btn-ghost btn-xs btn-circle absolute right-1.5 top-1/2 -translate-y-1/2"
                        x-show="filterManager.searchQuery.trim()"
                        @click="filterManager.searchQuery = ''"
                        :aria-label="$t('shift_plans.view.filter.clear')">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- Clear all (desktop; mobile has it in the header) -->
            <button type="button" class="btn btn-ghost btn-sm hidden lg:inline-flex"
                    x-show="filterManager.hasActiveFilters()"
                    @click="filterManager.clearFilters()"
                    x-text="$t('shift_plans.view.filter.clear')"></button>
        </div>

        <label class="flex items-center gap-2 min-h-11 cursor-pointer" x-show="hasDeclined">
            <input type="checkbox" class="checkbox checkbox-sm" x-model="filterManager.showDeclined" />
            <span x-text="$t('shift_plans.view.show_declined')"></span>
        </label>
    </div>

    <!-- Active filters summary (mobile, collapsed) -->
    <div x-show="!isFilterExpanded && filterManager.hasActiveFilters()">
        <div class="flex flex-wrap gap-1.5">
            <template x-if="filterManager.selectedTypes.length > 0">
                <div class="badge badge-outline">
                    <span x-text="$t('shift_plans.view.filter.types') + ': ' + filterManager.selectedTypes.length"></span>
                </div>
            </template>
            <template x-if="filterManager.selectedDay">
                <div class="badge badge-outline">
                    <span x-text="$t('shift_plans.view.filter.days') + ': ' + formatDate(filterManager.selectedDay)"></span>
                </div>
            </template>
            <template x-if="filterManager.selectedStatus !== 'all'">
                <div class="badge badge-outline">
                    <span x-text="$t('shift_plans.view.filter.status') + ': ' + $t('shift_plans.view.filter.status_' + filterManager.selectedStatus)"></span>
                </div>
            </template>
            <template x-if="filterManager.searchQuery.trim()">
                <div class="badge badge-outline">
                    <span class="truncate max-w-48" x-text="$t('shift_plans.view.filter.search') + ': ' + filterManager.searchQuery"></span>
                </div>
            </template>
        </div>
    </div>
</div>
{{ end }}
