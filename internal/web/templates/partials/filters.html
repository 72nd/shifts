{{ define "filters" }}
<div class="bg-base-200 rounded-box p-4 mb-4">
    <!-- Header with active filter count -->
    <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2">
            <h2 class="text-lg font-semibold" x-text="$t('shift_plans.view.filter.title')"></h2>
        </div>
        <!-- Clear Filters Button -->
        <button class="btn btn-outline btn-secondary btn-sm gap-2" 
                @click="filterManager.clearFilters()"
                x-show="filterManager.hasActiveFilters()">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
            <span x-text="$t('shift_plans.view.filter.clear')"></span>
        </button>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <!-- Shift Types Filter -->
        <div class="form-control w-full">
            <label class="label">
                <span class="label-text" x-text="$t('shift_plans.view.filter.types')"></span>
                <button @click="filterManager.selectedTypes = []" 
                        class="btn btn-ghost btn-xs" 
                        x-show="filterManager.selectedTypes.length > 0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </label>
            <div class="dropdown w-full">
                <div tabindex="0" role="button" 
                     class="input input-bordered w-full flex items-center justify-between"
                     :class="{ 'input-primary': filterManager.selectedTypes.length > 0 }">
                    <span x-text="filterManager.selectedTypes.length ? 
                        $t('shift_plans.view.filter.n_types_selected', { count: filterManager.selectedTypes.length }) : 
                        $t('shift_plans.view.filter.select_types')">
                    </span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </div>
                <div tabindex="0" class="dropdown-content z-[1] menu p-2 shadow bg-base-100 rounded-box w-full max-h-64 overflow-y-auto">
                    <div class="flex flex-col gap-1">
                        <!-- Select All Option -->
                        <label class="label cursor-pointer hover:bg-base-200 rounded-lg px-3 py-2 gap-2">
                            <input type="checkbox" 
                                   class="checkbox checkbox-sm" 
                                   :checked="filterManager.selectedTypes.length === shiftTypes.length"
                                   @change="filterManager.toggleAllTypes(shiftTypes.map(t => t.id))" />
                            <span class="label-text font-medium" x-text="$t('shift_plans.view.filter.all_types')"></span>
                        </label>
                        <div class="divider my-0"></div>
                        <!-- Individual Types -->
                        <template x-for="type in shiftTypes" :key="type.id">
                            <label class="label cursor-pointer hover:bg-base-200 rounded-lg px-3 py-2 gap-2">
                                <input type="checkbox" 
                                       class="checkbox checkbox-sm" 
                                       :checked="filterManager.selectedTypes.includes(type.id)"
                                       @change="filterManager.toggleType(type.id)" />
                                <span class="label-text" 
                                      x-text="plan.is_multilingual ? ($locale() === 'de' ? type.title_de : type.title_en) : type.title_en">
                                </span>
                            </label>
                        </template>
                    </div>
                </div>
            </div>
        </div>

        <!-- Days Filter -->
        <div class="form-control w-full">
            <label class="label">
                <span class="label-text" x-text="$t('shift_plans.view.filter.days')"></span>
                <button @click="filterManager.selectedDay = ''" 
                        class="btn btn-ghost btn-xs"
                        x-show="filterManager.selectedDay">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </label>
            <select class="select select-bordered w-full" 
                    x-model="filterManager.selectedDay"
                    :class="{ 'select-primary': filterManager.selectedDay }">
                <option value="" x-text="$t('shift_plans.view.filter.all_days')"></option>
                <template x-for="day in filterManager.getAvailableDays(shiftTypes)" :key="day">
                    <option :value="day" x-text="formatDate(day)"></option>
                </template>
            </select>
        </div>

        <!-- Status Filter -->
        <div class="form-control w-full">
            <label class="label">
                <span class="label-text" x-text="$t('shift_plans.view.filter.status')"></span>
                <button @click="filterManager.selectedStatus = 'all'" 
                        class="btn btn-ghost btn-xs"
                        x-show="filterManager.selectedStatus !== 'all'">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </label>
            <select class="select select-bordered w-full" 
                    x-model="filterManager.selectedStatus"
                    :class="{ 'select-primary': filterManager.selectedStatus !== 'all' }">
                <option value="all" x-text="$t('shift_plans.view.filter.status_all')"></option>
                <option value="empty" x-text="$t('shift_plans.view.filter.status_empty')"></option>
                <option value="critical" x-text="$t('shift_plans.view.filter.status_critical')"></option>
                <option value="full" x-text="$t('shift_plans.view.filter.status_full')"></option>
            </select>
        </div>

        <!-- Name Search -->
        <div class="form-control w-full">
            <label class="label">
                <span class="label-text" x-text="$t('shift_plans.view.filter.search')"></span>
                <button @click="filterManager.searchQuery = ''" 
                        class="btn btn-ghost btn-xs"
                        x-show="filterManager.searchQuery.trim()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </label>
            <input type="text" 
                   class="input input-bordered w-full" 
                   :class="{ 'input-primary': filterManager.searchQuery.trim() }"
                   x-model="filterManager.searchQuery"
                   :placeholder="$t('shift_plans.view.filter.search_placeholder')" />
        </div>
    </div>
</div>
{{ end }}
