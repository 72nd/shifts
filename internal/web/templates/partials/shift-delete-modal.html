{{ define "shift-delete-modal" }}
<dialog id="delete_shift_modal" class="modal">
    <div class="modal-box">
        <h3 class="font-bold text-lg mb-2" x-text="$t('shift_plans.view.delete_shift')"></h3>
        
        <!-- Error Display -->
        {{ template "error-display" "deleteShiftModal" }}

        <form method="dialog" @submit.prevent="deleteShiftModal.submit()">
            <p class="text-base-content/70">
                <span x-text="$t('shift_plans.view.confirm_delete_shift')"></span>
                <span class="font-medium text-base-content" x-text="formatTime(deleteShiftModal.currentShift?.start_time, deleteShiftModal.currentShift?.duration)"></span>?
            </p>

            <div class="flex justify-end gap-2 mt-6 pt-4 border-t border-base-content/20">
                <button type="button" 
                        @click="deleteShiftModal.close()" 
                        class="btn btn-sm" 
                        x-text="$t('common.cancel')">
                </button>
                <button type="submit" 
                        class="btn btn-sm btn-error" 
                        x-text="$t('common.delete')">
                </button>
            </div>
        </form>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button @click="deleteShiftModal.close()">close</button>
    </form>
</dialog>
{{ end }}
