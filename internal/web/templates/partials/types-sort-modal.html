{{ define "sort-types-modal" }}
<dialog id="sort_types_modal" class="modal">
    <div class="modal-box max-w-2xl">
        <h3 class="font-bold text-lg mb-4" x-text="$t('shift_plans.view.sort_types')"></h3>
        
        <!-- Error Display -->
        {{ template "error-display" "sortTypesModal" }}

        <!-- Sortable List -->
        <div class="space-y-2" 
             x-sort="sortTypesModal.handleSort.bind($data)"
             x-sort.ghost
             x-sort:config="{ animation: 150 }">
            <template x-for="(type, index) in sortTypesModal.localTypes" :key="type.id + '-' + index">
                <div x-sort:item="type.id"
                     class="flex items-center gap-2 p-2 bg-base-200 rounded-lg [body:not(.sorting)_&]:hover:bg-base-300">
                    <!-- Drag Handle -->
                    <div x-sort:handle class="flex-none cursor-move">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16" />
                        </svg>
                    </div>
                    
                    <!-- Type Title -->
                    <span x-text="plan.is_multilingual ? ($locale() === 'de' ? type.title_de : type.title_en) : type.title_en"></span>
                </div>
            </template>
        </div>

        <!-- Action Buttons -->
        <div class="flex justify-end gap-2 mt-6 pt-4 border-t border-base-content/20">
            <button type="button" 
                    @click="sortTypesModal.close()" 
                    class="btn btn-sm" 
                    x-text="$t('common.cancel')">
            </button>
            <button type="button"
                    @click="sortTypesModal.submit()"
                    class="btn btn-sm btn-primary" 
                    x-text="$t('common.save')">
            </button>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button @click="sortTypesModal.close()">close</button>
    </form>
</dialog>

<style>
.sortable-ghost {
    @apply opacity-50;
}
</style>
{{ end }}
