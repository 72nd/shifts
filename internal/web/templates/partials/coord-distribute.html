{{ define "coord-distribute" }}
<div x-data="coordDistribute" class="space-y-3">
    {{ template "coord-filters" . }}

    <!-- Preview of the auto-distribution replaces the views -->
    <div x-show="preview" class="min-w-0 max-w-3xl">
        {{ template "coord-preview" . }}
    </div>

    <!-- Time views (from lg): a band above the workbench, filled by coord-timeline.html / coord-person-timeline.html -->
    <div x-show="!preview" class="min-w-0"
        :class="activeView === 'list' ? 'space-y-3' : 'space-y-3 lg:space-y-0 lg:flex lg:flex-col lg:gap-3 lg:h-[calc(100dvh-14rem)] lg:min-h-[32rem]'">
        {{ template "coord-timeline" . }}
        {{ template "coord-person-timeline" . }}

    <!-- Workbench: with the list (shifts, workbench, persons), under the timeline (workbench, persons) or alone (people view) -->
    <div class="grid gap-4 min-w-0"
        :class="activeView === 'list'
            ? 'md:grid-cols-[18rem_minmax(0,1fr)] xl:grid-cols-[19rem_minmax(0,1fr)_22rem] 2xl:grid-cols-[22rem_minmax(0,1fr)_28rem] md:grid-rows-[minmax(0,1fr)] md:h-[calc(100dvh-14rem)] md:min-h-[32rem]'
            : (activeView === 'timeline'
                ? 'xl:grid-cols-[minmax(0,1fr)_22rem] 2xl:grid-cols-[minmax(0,1fr)_28rem] lg:grid-rows-[minmax(0,1fr)] lg:flex-1 lg:min-h-0'
                : 'lg:grid-rows-[minmax(0,1fr)] lg:flex-1 lg:min-h-0')">

        <!-- Shifts: grouped by day -->
        <aside x-show="activeView === 'list'" class="relative min-w-0 min-h-0 space-y-3 md:overflow-y-auto">
            <div x-show="!shiftList.length" class="space-y-2">
                <p class="text-base-content/70" x-text="$t('coord.no_shifts')"></p>
                <button type="button" class="btn btn-sm min-h-11" x-show="hasFilter" @click="resetFilter()" x-text="$t('coord.filter_reset')"></button>
            </div>

            <!-- Phone: select instead of the list -->
            <label class="md:hidden flex flex-col gap-1 text-sm" x-show="shiftList.length">
                <span x-text="$t('coord.shift')"></span>
                <select class="select select-bordered h-11 min-h-11 w-full" @change="selectShift(Number($event.target.value) || null)">
                    <option value="" :selected="!selectedShiftId" x-text="$t('coord.select_shift_short')"></option>
                    <template x-for="cs in shiftList" :key="cs.id">
                        <option :value="cs.id" :selected="cs.id === selectedShiftId" x-text="shiftLabel(cs) + ' ' + occupancyBadge(cs, occupancy(cs))"></option>
                    </template>
                </select>
            </label>

            <div class="hidden md:block" x-show="shiftList.length"
                @keydown="const id = neighbourShift($event, shiftList, selectedShiftId); if (id) { $event.preventDefault(); selectShift(id); $nextTick(() => $el.querySelector('[data-shift=\'' + id + '\']')?.focus()); }">
                <template x-for="g in shiftGroups(shiftList)" :key="g.day">
                    <section>
                        <h3 class="sticky top-0 z-10 bg-base-100 px-2 py-1 text-sm font-medium" x-text="dayLabel(g.day)"></h3>
                        <ul class="divide-y divide-base-300">
                            <template x-for="cs in g.shifts" :key="cs.id">
                                <li>
                                    <button type="button" :data-shift="cs.id"
                                        class="w-full min-h-11 px-2 py-1 flex items-center gap-2 text-left hover:bg-base-200"
                                        :class="{ 'bg-base-200 font-semibold': cs.id === selectedShiftId }"
                                        :aria-current="cs.id === selectedShiftId ? 'true' : null"
                                        @click="selectShift(cs.id)">
                                        <span class="min-w-0 flex-1 flex items-baseline gap-2">
                                            <span class="tabular-nums text-sm text-base-content/70 shrink-0" x-text="time(cs.start)"></span>
                                            <span class="truncate" :title="typeTitle(cs.type)" x-text="typeTitle(cs.type)"></span>
                                        </span>
                                        <span class="flex items-center gap-1 shrink-0">
                                            <span x-show="isHighlighted(cs, highlightKey)" class="inline-block h-2 w-2 rounded-full bg-primary" role="img" :aria-label="$t('coord.person_involved')"></span>
                                            <span class="inline-flex" x-show="cs.popular">{{ template "coord-icon-star" }}<span x-show="cs.tier === 2">{{ template "coord-icon-star-very" }}</span></span>
                                            <span x-show="cs.expNeed.count > 0 && !cs.expNeed.met">{{ template "coord-icon-warning" }}</span>
                                            <span x-show="cs.locked" class="text-info">{{ template "lock-icon" }}</span>
                                            <span class="badge badge-sm" :class="{ 'badge-warning': cs.overbooked }" x-text="occupancyBadge(cs, occupancy(cs))"></span>
                                        </span>
                                    </button>
                                </li>
                            </template>
                        </ul>
                    </section>
                </template>
            </div>
        </aside>

        <!-- Workbench -->
        <section class="relative min-w-0 min-h-0 space-y-4 md:overflow-y-auto" aria-live="polite">
            <p class="hidden md:block text-base-content/70" x-show="!selectedShift && shiftList.length" x-text="$t('coord.select_shift')"></p>

            <template x-if="selectedShift">
                <div class="space-y-4">
                    <!-- Head: stays visible while the lists scroll -->
                    <header class="sticky top-0 z-10 bg-base-100 pb-2 space-y-1.5 min-w-0 border-b border-base-300">
                        <h2 class="text-lg font-semibold break-words" x-text="shiftLabel(selectedShift)"></h2>
                        <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-sm text-base-content/70">
                            <span x-text="$t('coord.places', { occupied: selectedShift.occupancy, required: selectedShift.unlimited ? '∞' : selectedShift.required })"></span>
                            <span class="inline-flex items-center gap-1" x-show="selectedShift.expNeed.count > 0">
                                <span x-show="!selectedShift.expNeed.met">{{ template "coord-icon-warning" }}</span>
                                <span x-text="$t('coord.exp_progress', { have: selectedShift.expNeed.have, count: selectedShift.expNeed.count, level: levelLabel(selectedShift) })"></span>
                            </span>
                            <span x-show="model.flags.anyFactor" x-text="$t('coord.load_factor') + ' ' + number(selectedShift.factor)"></span>
                            <span class="inline-flex items-center gap-1" x-show="selectedShift.popular">{{ template "coord-icon-star" }}<span x-show="selectedShift.tier === 2">{{ template "coord-icon-star-very" }}</span><span x-text="$t(selectedShift.tier === 2 ? 'coord.very_popular' : 'coord.popular')"></span></span>
                            <span class="inline-flex items-center gap-1" x-show="selectedShift.locked"><span class="text-info">{{ template "lock-icon" }}</span><span x-text="$t('coord.locked')"></span></span>
                        </div>

                        <div class="flex flex-wrap items-center gap-x-2 gap-y-2" x-show="!selectedShift.unlimited">
                            <div class="join" role="group" :aria-label="$t('coord.auto_candidates')">
                                <button type="button" class="btn btn-sm join-item min-h-11 lg:min-h-8" :class="{ 'btn-active': source === 'interested' }"
                                    :aria-pressed="source === 'interested' ? 'true' : 'false'" @click="setSource('interested')" x-text="$t('coord.source_interested')"></button>
                                <button type="button" class="btn btn-sm join-item min-h-11 lg:min-h-8" :class="{ 'btn-active': source === 'all' }"
                                    :aria-pressed="source === 'all' ? 'true' : 'false'" @click="setSource('all')" x-text="$t('coord.source_all')"></button>
                            </div>
                            <span class="hidden lg:block h-5 w-px bg-base-300" aria-hidden="true"></span>
                            <button type="button" class="btn btn-primary btn-sm min-h-11 lg:min-h-8"
                                :disabled="busy || suggestionCount(selectedShift, candidates.ranked, candidates.tie) === 0"
                                @click="apply(suggestionOps(selectedShift, candidates.ranked, candidates.tie), { pending: 'suggestion' })">
                                <span class="loading loading-spinner loading-sm" x-show="pendingKey === 'suggestion'"></span>
                                <span x-text="$t('coord.take_suggestion_count', { count: suggestionCount(selectedShift, candidates.ranked, candidates.tie) })"></span>
                            </button>
                            <span class="text-sm text-base-content/70" x-show="candidates.tie && !candidates.tie.drawn"
                                x-text="$t('coord.tie_open_hint', { places: candidates.tie?.places })"></span>
                            <button type="button" class="btn btn-sm min-h-11 lg:min-h-8" :disabled="busy || !selectedShift.wishes.length"
                                @click="apply(declineRestOps(selectedShift, model.persons), { lock: lockAfter ? [selectedShift.id] : [], pending: 'rest' })"
                                x-text="$t('coord.decline_rest')"></button>
                            <label class="flex items-center gap-2 min-h-11 lg:min-h-8 cursor-pointer text-sm">
                                <input type="checkbox" class="checkbox checkbox-sm" x-model="lockAfter">
                                <span x-text="$t('coord.and_lock')"></span>
                            </label>
                        </div>

                        <!-- At the same time: no bar without parallel shifts -->
                        <div class="flex flex-wrap items-center gap-x-2 gap-y-1" x-show="concurrent.length">
                            <h3 class="text-sm font-medium" x-text="$t('coord.concurrent')"></h3>
                            <template x-for="o in visibleConcurrent(concurrent)" :key="o.id">
                                <button type="button" class="btn btn-xs min-h-8 lg:min-h-6 max-w-full font-normal gap-1"
                                    :class="{ 'btn-active': hoverShiftId === o.id }"
                                    :title="shiftLabel(o)"
                                    @click="selectShift(o.id)"
                                    @mouseenter="hoverShiftId = o.id" @mouseleave="hoverShiftId = null"
                                    @focus="hoverShiftId = o.id" @blur="hoverShiftId = null">
                                    <span class="tabular-nums" x-text="time(o.start)"></span>
                                    <span class="truncate" x-text="typeTitle(o.type)"></span>
                                    <span class="badge badge-xs" :class="{ 'badge-warning': o.overbooked }" x-text="occupancyBadge(o, occupancy(o))"></span>
                                    <span class="inline-flex" x-show="o.popular">{{ template "coord-icon-star" }}<span x-show="o.tier === 2">{{ template "coord-icon-star-very" }}</span></span>
                                    <span class="inline-flex items-center gap-1 text-warning" x-show="o.expNeed.count > 0 && !o.expNeed.met">
                                        <span aria-hidden="true">⚠</span>
                                        <span x-text="$t('coord.exp_short', { have: o.expNeed.have, count: o.expNeed.count })"></span>
                                    </span>
                                </button>
                            </template>
                            <button type="button" class="btn btn-ghost btn-xs min-h-8 lg:min-h-6" x-show="!concurrentOpen && concurrent.length > visibleConcurrent(concurrent).length"
                                @click="concurrentOpen = true"
                                x-text="$t('coord.concurrent_more', { count: concurrent.length - visibleConcurrent(concurrent).length })"></button>
                        </div>
                    </header>

                <!-- Assigned -->
                <div x-show="selectedShift.assigned.length" class="space-y-1">
                    <h3 class="text-sm font-medium pt-2" x-text="$t('coord.section_assigned')"></h3>
                    <ul class="divide-y divide-base-300">
                        <template x-for="key in selectedShift.assigned" :key="key">
                            <li class="min-h-11 lg:min-h-8 py-1 lg:py-0 flex flex-wrap lg:flex-nowrap items-center gap-x-2 gap-y-1" :class="{ 'bg-base-200': highlightKey === key }">
                                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0 text-success" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
                                <span class="sr-only" x-text="$t('shift_plans.view.status_assigned')"></span>
                                <button type="button" class="font-medium min-w-24 min-h-11 lg:min-h-8 flex-1 lg:flex-none lg:max-w-56 truncate text-left" :title="model.persons.get(key).name"
                                    :aria-pressed="highlightKey === key ? 'true' : 'false'"
                                    @click="toggleHighlight(key)" x-text="model.persons.get(key).name"></button>
                                {{ template "coord-jump" "model.persons.get(key)" }}
                                <span class="contents" x-show="model.experience.field && model.persons.get(key).level >= 0">{{ template "coord-level-badge" "model.persons.get(key).level" }}</span>
                                <span class="badge badge-ghost badge-xs shrink-0" x-show="part(selectedShift.id, key)?.addedByAdmin" x-text="$t('coord.added_by_coordination')"></span>
                                <span class="ml-auto flex gap-1 shrink-0">
                                    <button type="button" class="btn btn-xs min-h-11 lg:min-h-7" :class="{ 'loading': pendingKey === key }" :disabled="busy"
                                        x-show="part(selectedShift.id, key)?.status === 'assigned'"
                                        @click="apply(resetOps(selectedShift, model.persons.get(key).name, part(selectedShift.id, key)), { pending: key })"
                                        x-text="$t('coord.reset')"></button>
                                    <button type="button" class="btn btn-xs min-h-11 lg:min-h-7" :disabled="busy"
                                        x-show="part(selectedShift.id, key)?.status !== 'assigned'"
                                        @click="apply(declineOps(selectedShift, model.persons.get(key).name), { pending: key })"
                                        x-text="$t('coord.decline')"></button>
                                </span>
                            </li>
                        </template>
                    </ul>
                </div>

                <!-- Candidates: suggestion (the first open places), then the rest -->
                <div x-show="!selectedShift.unlimited && selectedShift.open > 0" class="space-y-1">
                    <h3 class="text-sm font-medium pt-2" x-text="$t('coord.section_suggestion')"></h3>
                    <p class="text-base-content/70" x-show="!candidates.ranked.length" x-text="$t('coord.no_candidates')"></p>
                    <button type="button" class="btn btn-sm min-h-11" x-show="!candidates.ranked.length && source === 'interested'"
                        @click="setSource('all')" x-text="$t('coord.show_everyone')"></button>
                    <ol class="divide-y divide-base-300">
                        <template x-for="r in candidateRows(selectedShift, candidates.ranked, candidates.tie)" :key="r.id">
                            <li :class="{ 'bg-base-200': r.kind === 'row' && highlightKey === r.id }">
                                <template x-if="r.kind === 'head'">
                                    <h3 class="text-sm font-medium pt-2 pb-1" x-text="$t('coord.section_more', { count: r.count })"></h3>
                                </template>
                                <template x-if="r.kind === 'tie'">
                                    <div class="flex flex-wrap items-center gap-x-3 gap-y-1 pt-2 pb-1">
                                        <h3 class="text-sm font-medium min-w-0 flex-1"
                                            x-text="$t(r.places === 1 ? 'coord.tie_head_one' : 'coord.tie_head', { count: r.count, places: r.places })"></h3>
                                        <button type="button" class="btn btn-sm min-h-11 lg:min-h-8" :class="{ 'btn-ghost': r.drawn }" :disabled="busy"
                                            @click="drawTie(selectedShift.id, candidates.tie.keys)"
                                            x-text="$t(r.drawn ? 'coord.tie_redraw' : 'coord.tie_draw')"></button>
                                    </div>
                                </template>
                                <template x-if="r.kind === 'all'">
                                    <button type="button" class="btn btn-sm min-h-11 my-2" @click="showAllMore = true"
                                        x-text="$t('coord.show_all', { count: r.count })"></button>
                                </template>
                                <template x-if="r.kind === 'row'">
                                    <div class="flex flex-wrap lg:flex-nowrap items-center gap-x-2 gap-y-1 min-h-11 lg:min-h-8 py-1 lg:py-0">
                                        <span class="w-5 shrink-0 text-right text-xs text-base-content/70 tabular-nums" x-text="r.tied ? '' : r.rank"></span>
                                        <button type="button" class="font-medium min-w-24 min-h-11 lg:min-h-8 flex-1 lg:flex-none lg:max-w-56 truncate text-left" :title="r.c.name"
                                            :aria-pressed="highlightKey === r.c.key ? 'true' : 'false'"
                                            @click="toggleHighlight(r.c.key)" x-text="r.c.name"></button>
                                        {{ template "coord-jump" "r.c" }}
                                        <span class="contents" x-show="model.experience.field && r.c.level >= 0">{{ template "coord-level-badge" "r.c.level" }}</span>
                                        <span class="badge badge-ghost badge-xs shrink-0" x-show="source === 'all' && r.c.interested" x-text="$t('coord.wish')"></span>
                                        <template x-for="x in topReasons(r.c, r.suggested).shown" :key="x.id">
                                            <span class="badge badge-ghost badge-xs shrink-0 whitespace-nowrap" x-text="reasonText('reason', x)"></span>
                                        </template>
                                        <span class="badge badge-ghost badge-xs shrink-0" x-show="topReasons(r.c, r.suggested).rest.length"
                                            :title="topReasons(r.c, r.suggested).rest.map(x => reasonText('reason', x)).join(', ')">
                                            <span aria-hidden="true" x-text="$t('coord.reasons_more', { count: topReasons(r.c, r.suggested).rest.length })"></span>
                                            <span class="sr-only" x-text="topReasons(r.c, r.suggested).rest.map(x => reasonText('reason', x)).join(', ')"></span>
                                        </span>
                                        <span class="inline-flex items-center gap-0.5 text-xs text-base-content/70 shrink-0" tabindex="0" x-show="r.c.alsoInterested.length"
                                            :title="$t('coord.also_interested_short', { shifts: r.c.alsoInterested.map(id => shiftLabel(model.shifts.get(id))).join(', ') })"
                                            @mouseenter="hoverShiftId = r.c.alsoInterested[0]" @mouseleave="hoverShiftId = null"
                                            @focus="hoverShiftId = r.c.alsoInterested[0]" @blur="hoverShiftId = null">
                                            <span aria-hidden="true">⇄</span><span aria-hidden="true" x-text="r.c.alsoInterested.length"></span>
                                            <span class="sr-only" x-text="$t('coord.also_interested_short', { shifts: r.c.alsoInterested.map(id => shiftLabel(model.shifts.get(id))).join(', ') })"></span>
                                        </span>
                                        <span class="ml-auto shrink-0 text-xs text-base-content/70 tabular-nums whitespace-nowrap" x-text="hoursText(model.persons.get(r.c.key), n => number(n))"></span>
                                        <span class="inline-flex items-center gap-0.5 text-warning shrink-0" tabindex="0" x-show="r.c.warnings.length || r.c.impacts.length"
                                            :title="candidateNotes(r.c)"
                                            @mouseenter="hoverShiftId = r.c.impacts[0]?.params.shiftId ?? null" @mouseleave="hoverShiftId = null"
                                            @focus="hoverShiftId = r.c.impacts[0]?.params.shiftId ?? null" @blur="hoverShiftId = null">
                                            <span aria-hidden="true">⚠</span>
                                            <span aria-hidden="true" class="text-xs" x-show="r.c.warnings.length + r.c.impacts.length > 1" x-text="r.c.warnings.length + r.c.impacts.length"></span>
                                            <span class="sr-only" x-text="candidateNotes(r.c)"></span>
                                        </span>
                                        <span class="flex gap-1 shrink-0">
                                            <button type="button" class="btn btn-xs min-h-11 lg:min-h-7" :class="{ 'loading': pendingKey === r.c.key }" :disabled="busy"
                                                @click="apply(assignOps(selectedShift, r.c), { pending: r.c.key })" x-text="$t('coord.assign')"></button>
                                            <button type="button" class="btn btn-xs min-h-11 lg:min-h-7" :disabled="busy" x-show="r.c.interested"
                                                @click="apply(declineOps(selectedShift, r.c.name), { pending: r.c.key })" x-text="$t('coord.decline')"></button>
                                        </span>
                                    </div>
                                </template>
                            </li>
                        </template>
                    </ol>
                </div>
                <p class="text-base-content/70" x-show="!selectedShift.unlimited && selectedShift.open === 0" x-text="$t('coord.shift_full')"></p>
                <p class="text-base-content/70" x-show="selectedShift.unlimited" x-text="$t('coord.unlimited_shift')"></p>

                <!-- Not available -->
                <details x-show="candidates.unavailable.length" class="border-t border-base-300 pt-2">
                    <summary class="min-h-11 flex items-center cursor-pointer font-medium" x-text="$t('coord.section_unavailable', { count: candidates.unavailable.length })"></summary>
                    <ul class="divide-y divide-base-300">
                        <template x-for="u in candidates.unavailable" :key="u.key">
                            <li class="min-h-11 py-1 flex flex-wrap items-center gap-x-3 gap-y-1">
                                <span class="font-medium min-w-0 truncate" :title="u.name" x-text="u.name"></span>
                                <span class="text-sm text-base-content/70 min-w-0 flex-1"
                                    x-text="u.reason === 'overlap' ? $t('coord.unavail_overlap', { shift: shiftLabel(model.shifts.get(u.params.shiftId)) }) : $t('coord.unavail_' + u.reason)"></span>
                                <button type="button" class="btn btn-sm min-h-11" x-show="u.move" :disabled="busy"
                                    @click="askMove(u, selectedShift.id)" x-text="$t('coord.move')"></button>
                                <button type="button" class="btn btn-sm min-h-11" x-show="u.reason === 'declined'" :disabled="busy"
                                    @click="apply(resetOps(selectedShift, u.name, part(selectedShift.id, u.key)), { pending: u.key })" x-text="$t('coord.reset')"></button>
                            </li>
                        </template>
                    </ul>
                </details>

                </div>
            </template>

            <!-- Persons: collapsible below on narrower screens -->
            <details x-show="activeView !== 'people'" class="xl:hidden min-w-0">
                <summary class="min-h-11 flex items-center cursor-pointer font-medium" x-text="$t('coord.people_title') + ' (' + personList.length + ')'"></summary>
                <div class="max-h-[60vh] overflow-y-auto">
                    {{ template "coord-persons-column" . }}
                </div>
            </details>
        </section>

        <!-- Persons: column on wide screens -->
        <aside x-show="activeView !== 'people'" class="relative hidden xl:block min-w-0 min-h-0 overflow-y-auto">
            <h2 class="font-medium mb-2" x-text="$t('coord.people_title')"></h2>
            {{ template "coord-persons-column" . }}
        </aside>
    </div>

    </div>
</div>
{{ end }}
