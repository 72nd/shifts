<!-- Technical Error Section -->
<div x-show="technicalError" class="mt-4">
    <!-- User-friendly error message -->
    <div class="p-4 bg-red-50 border border-red-200 rounded-lg">
        <div class="flex justify-between items-start">
            <div class="text-red-700 text-sm font-medium" x-text="userErrorMessage"></div>
            <button @click="clearTechnicalError()" class="text-red-400 hover:text-red-600">
                <span class="sr-only" x-text="$t('common.close')"></span>
                <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
            </button>
        </div>

        <!-- Technical details section -->
        <div class="mt-2">
            <div class="flex items-center justify-between text-sm text-gray-600">
                <span x-text="$t('common.technical_details')"></span>
                <div class="flex items-center">
                    <button @click="copyErrorDetails()" 
                            class="inline-flex items-center px-2 py-1 text-xs font-medium text-blue-600 hover:text-blue-800">
                        <svg class="h-4 w-4 mr-1" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M8 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z" />
                            <path d="M6 3a2 2 0 00-2 2v11a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2 3 3 0 01-3 3H9a3 3 0 01-3-3z" />
                        </svg>
                        <span x-text="$t('common.copy')"></span>
                    </button>
                    <span x-show="copySuccess" 
                          x-transition:enter="transition ease-out duration-300"
                          x-transition:enter-start="opacity-0"
                          x-transition:enter-end="opacity-100"
                          class="text-green-600 text-xs ml-2"
                          x-text="$t('common.copied')">
                    </span>
                </div>
            </div>
            <pre class="mt-2 text-xs bg-gray-100 p-2 rounded overflow-x-auto font-mono" x-text="formatError(technicalError)"></pre>
        </div>
    </div>
</div>
