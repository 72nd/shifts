{{ define "settings-modal" }}
<dialog id="settings_modal" class="modal">
    <div class="modal-box max-w-6xl">
        <h3 class="font-bold text-lg mb-2" x-text="$t('shift_plans.view.settings')"></h3>
        
        <!-- Error Display -->
        {{ template "error-display" "settingsModal" }}
        
        <form @submit.prevent="settingsModal.submit()" class="space-y-3">
            <!-- Language Selection -->
            <div class="form-control">
                <label class="label cursor-pointer justify-start gap-4 py-0">
                    <input type="checkbox" x-model="settingsModal.is_multilingual" class="checkbox checkbox-sm" />
                    <span class="label-text" x-text="$t('shift_plans.new.multilingual')"></span>
                </label>
            </div>

            <!-- Collaborative Mode -->
            <div class="form-control">
                <label class="label cursor-pointer justify-start gap-4 py-0">
                    <input type="checkbox" x-model="settingsModal.collaborative_mode" class="checkbox checkbox-sm" />
                    <span class="label-text" x-text="$t('shift_plans.settings.collaborative_mode')"></span>
                </label>
                <label class="label py-0">
                    <span class="label-text-alt opacity-60" x-text="$t('shift_plans.settings.collaborative_mode_help')"></span>
                </label>
            </div>

            <!-- Not selected sign-ups -->
            <div class="form-control">
                <label class="label cursor-pointer justify-start gap-4 py-0">
                    <input type="checkbox" x-model="settingsModal.hide_declined" class="checkbox checkbox-sm" />
                    <span class="label-text" x-text="$t('shift_plans.settings.hide_declined')"></span>
                </label>
                <label class="label py-0">
                    <span class="label-text-alt opacity-60" x-text="$t('shift_plans.settings.hide_declined_help')"></span>
                </label>
            </div>

            <!-- Title Fields -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <template x-if="settingsModal.is_multilingual">
                    <div class="form-control w-full">
                        <label class="label py-0">
                            <span class="label-text font-medium" x-text="$t('shift_plans.new.title_de')"></span>
                        </label>
                        <input type="text" 
                               x-model="settingsModal.title_de" 
                               class="input input-bordered input-sm w-full"
                               :class="{ 'input-error': settingsModal.errors.title_de }" 
                               required />
                        <label class="label py-0" x-show="settingsModal.errors.title_de">
                            <span class="label-text-alt text-error" x-text="settingsModal.errors.title_de"></span>
                        </label>
                    </div>
                </template>
                
                <div class="form-control w-full" :class="{ 'md:col-span-2': !settingsModal.is_multilingual }">
                    <label class="label py-0">
                        <span class="label-text font-medium" x-text="settingsModal.is_multilingual ? $t('shift_plans.new.title_en') : $t('shift_plans.new.title_field')"></span>
                    </label>
                    <input type="text" 
                           x-model="settingsModal.title_en" 
                           class="input input-bordered input-sm w-full"
                           :class="{ 'input-error': settingsModal.errors.title_en }" 
                           required />
                    <label class="label py-0" x-show="settingsModal.errors.title_en">
                        <span class="label-text-alt text-error" x-text="settingsModal.errors.title_en"></span>
                    </label>
                </div>
            </div>

            <!-- Description Fields -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <template x-if="settingsModal.is_multilingual">
                    <div class="form-control w-full">
                        <label class="label py-0">
                            <span class="label-text font-medium" x-text="$t('shift_plans.new.description_de')"></span>
                            <span class="label-text-alt opacity-60" x-text="$t('common.optional')"></span>
                        </label>
                        <textarea x-model="settingsModal.description_de" 
                                  class="textarea textarea-bordered textarea-sm w-full h-24"
                                  :class="{ 'textarea-error': settingsModal.errors.description_de }"></textarea>
                        <label class="label py-0" x-show="settingsModal.errors.description_de">
                            <span class="label-text-alt text-error" x-text="settingsModal.errors.description_de"></span>
                        </label>
                    </div>
                </template>
                
                <div class="form-control w-full" :class="{ 'md:col-span-2': !settingsModal.is_multilingual }">
                    <label class="label py-0">
                        <span class="label-text font-medium" x-text="settingsModal.is_multilingual ? $t('shift_plans.new.description_en') : $t('shift_plans.new.description')"></span>
                        <span class="label-text-alt opacity-60" x-text="$t('common.optional')"></span>
                    </label>
                    <textarea x-model="settingsModal.description_en" 
                              class="textarea textarea-bordered textarea-sm w-full h-24"
                              :class="{ 'textarea-error': settingsModal.errors.description_en }"></textarea>
                    <label class="label py-0" x-show="settingsModal.errors.description_en">
                        <span class="label-text-alt text-error" x-text="settingsModal.errors.description_en"></span>
                    </label>
                </div>
            </div>

            <!-- Date Fields -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="form-control w-full">
                    <label class="label py-0">
                        <span class="label-text font-medium" x-text="$t('shift_plans.new.start_date')"></span>
                    </label>
                    <input type="date" 
                           x-model="settingsModal.start_date" 
                           class="input input-bordered input-sm w-full"
                           :class="{ 'input-error': settingsModal.errors.start_date }" 
                           required />
                    <label class="label py-0" x-show="settingsModal.errors.start_date">
                        <span class="label-text-alt text-error" x-text="settingsModal.errors.start_date"></span>
                    </label>
                </div>
                
                <div class="form-control w-full">
                    <label class="label py-0">
                        <span class="label-text font-medium" x-text="$t('shift_plans.new.end_date')"></span>
                    </label>
                    <input type="date" 
                           x-model="settingsModal.end_date" 
                           class="input input-bordered input-sm w-full"
                           :class="{ 'input-error': settingsModal.errors.end_date }" 
                           required />
                    <label class="label py-0" x-show="settingsModal.errors.end_date">
                        <span class="label-text-alt text-error" x-text="settingsModal.errors.end_date"></span>
                    </label>
                </div>
            </div>

            <!-- Day Boundary Time -->
            <div class="form-control w-full max-w-xs">
                <label class="label py-0">
                    <span class="label-text font-medium" x-text="$t('shift_plans.settings.day_boundary_time')"></span>
                </label>
                <input type="time" 
                       x-model="settingsModal.day_boundary_time" 
                       class="input input-bordered input-sm w-full"
                       :class="{ 'input-error': settingsModal.errors.day_boundary_time }" />
                <label class="label py-0">
                    <span class="label-text-alt opacity-60" x-text="$t('shift_plans.settings.day_boundary_time_help')"></span>
                </label>
                <label class="label py-0" x-show="settingsModal.errors.day_boundary_time">
                    <span class="label-text-alt text-error" x-text="settingsModal.errors.day_boundary_time"></span>
                </label>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-col gap-4 mt-6 pt-4 border-t border-base-content/20">
                <div class="flex justify-between gap-2">
                    <button type="button"
                            @click="settingsModal.showDeleteConfirm = true"
                            class="btn btn-sm btn-error"
                            x-show="!settingsModal.showDeleteConfirm"
                            x-text="$t('shift_plans.settings.delete_plan')">
                    </button>
                    <div class="flex gap-2">
                        <button type="button" 
                                @click="settingsModal.close()" 
                                class="btn btn-sm" 
                                x-text="$t('common.cancel')">
                        </button>
                        <button type="submit" 
                                class="btn btn-sm btn-primary" 
                                x-text="$t('common.save')">
                        </button>
                    </div>
                </div>
                
                <!-- Delete Confirmation -->
                <div x-show="settingsModal.showDeleteConfirm" class="space-y-4">
                    <p class="text-sm text-error font-medium" x-text="$t('shift_plans.settings.delete_warning')"></p>
                    <div class="form-control w-full">
                        <input type="password" 
                               x-model="settingsModal.deletePassword"
                               :placeholder="$t('shift_plans.view.admin_password')"
                               :class="{ 'input-error': settingsModal.deleteError }"
                               class="input input-bordered input-sm w-full" />
                        <label class="label py-0" x-show="settingsModal.deleteError">
                            <span class="label-text-alt text-error" x-text="settingsModal.deleteError"></span>
                        </label>
                    </div>
                    <div class="flex gap-2">
                        <button type="button"
                                @click="settingsModal.cancelDelete()"
                                class="btn btn-sm flex-1"
                                x-text="$t('common.cancel')">
                        </button>
                        <button type="button"
                                @click="settingsModal.confirmDelete()"
                                :disabled="!settingsModal.deletePassword"
                                class="btn btn-sm btn-error flex-1"
                                x-text="$t('common.delete')">
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button>close</button>
    </form>
</dialog>
{{ end }}
