# Server configuration
host = "localhost"
port = 8080

# Database configuration
db_path = "data/shifts.db"

# Logging configuration
log_level = "info" 

# Metrics configuration (separate port, not exposed publicly)
metrics_enabled = true
metrics_port = 9090

# Default view for shift plans when the visitor has no ?view= or saved preference ("timetable" or "list")
default_view = "timetable"

# Default IANA time zone for new plans and start value when migrating existing plans (each plan stores its own zone)
timezone = "Europe/Berlin"
