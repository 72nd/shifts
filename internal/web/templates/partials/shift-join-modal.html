{{ define "shift-join-modal" }}
<dialog id="join_modal" class="modal">
    <form method="dialog" class="modal-box" @submit.prevent="!joinNotice && joinModal.submit()">
        <h3 class="font-bold text-lg" x-text="$t('shift_plans.view.join_shift')"></h3>
        
        <!-- Shift became full or was deleted while the dialog is open -->
        <div x-show="joinNotice" class="mb-4">
            <div role="alert" class="alert alert-warning">
                <span x-text="noticeText(joinNotice)"></span>
            </div>
        </div>

        <!-- User-friendly Error Alert (ohne technische Details) -->
        <div x-show="joinModal.hasUserFriendlyError" class="mb-4">
            <div role="alert" class="alert alert-warning">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                <div>
                    <h3 class="font-bold" x-text="joinModal.userFriendlyErrorTitle"></h3>
                    <div class="text-sm" x-text="joinModal.userFriendlyErrorMessage"></div>
                </div>
            </div>
        </div>
        
        <!-- Technical Error Display -->
        {{ template "error-display" "joinModal" }}
        
        <div class="py-4">
            <div class="form-control w-full">
                <label class="label">
                    <span class="label-text" x-text="$t('shift_plans.view.enter_name')"></span>
                </label>
                <input type="text" x-model="joinModal.name" 
                       @keyup.enter="!joinNotice && joinModal.submit()"
                       class="input input-bordered w-full" 
                       :class="{ 'input-error': joinModal.errors.name }"
                       :placeholder="$t('shift_plans.view.name_placeholder')" />
                <label class="label" x-show="joinModal.errors.name">
                    <span class="label-text-alt text-error" x-text="joinModal.errors.name"></span>
                </label>
            </div>
        </div>
        <div class="modal-action">
            <button type="button" @click="joinModal.close()" class="btn" x-text="$t('common.cancel')"></button>
            <button type="submit" class="btn btn-success" :disabled="!!joinNotice" x-text="$t('shift_plans.view.join')"></button>
        </div>
    </form>
    <form method="dialog" class="modal-backdrop">
        <button @click="joinModal.close()">close</button>
    </form>
</dialog>
{{ end }}
