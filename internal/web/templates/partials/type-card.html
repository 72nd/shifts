{{ define "shift-type-card" }}
<div class="bg-base-200/70 rounded-box p-2 md:p-4 mb-3 md:mb-4" x-data="{ isTypeExpanded: true, isDescriptionExpanded: false, openShiftsCount: 0, isDescriptionLong: false }" 
     x-init="
        openShiftsCount = type.shifts ? type.shifts.reduce((count, shift) => count + Math.max(0, shift.required - (shift.participants?.length || 0)), 0) : 0;
        $nextTick(() => {
            // Check if description is actually longer than 3 lines
            const descEl = $refs.description;
            if (descEl) {
                const lineHeight = parseInt(window.getComputedStyle(descEl).lineHeight);
                const height = descEl.scrollHeight;
                isDescriptionLong = height > lineHeight * 3;
            }
        });
     ">
    <!-- Type Header -->
    <div class="flex items-center justify-between mb-2">
        <div class="flex-1">
            <div class="flex items-center cursor-pointer" @click.stop="isTypeExpanded = !isTypeExpanded">
                <h2 class="text-xl font-bold"
                    x-text="plan.is_multilingual ? ($locale() === 'de' ? type.title_de : type.title_en) : type.title_en">
                </h2>
                
                <!-- Open Shifts Progress Bar (replacing badge) -->
                <div class="ml-2" x-show="type.shifts && type.shifts.length > 0">
                    <div class="radial-progress text-[10px]" 
                         x-bind:style="{ '--value': Math.round(((type.shifts.reduce((total, shift) => total + (shift.participants?.length || 0), 0)) / (type.shifts.reduce((total, shift) => total + shift.required, 0)) * 100) || 0), '--size': '1.8rem', '--thickness': '2.4px' }"
                         :class="{
                             'text-error': openShiftsCount === type.shifts.reduce((total, shift) => total + shift.required, 0),
                             'text-success': openShiftsCount === 0,
                             'text-warning': openShiftsCount > type.shifts.reduce((total, shift) => total + shift.required, 0) * 0.5,
                             'text-primary': openShiftsCount > 0
                         }">
                        <span x-text="(type.shifts.reduce((total, shift) => total + (shift.participants?.length || 0), 0)) + '/' + (type.shifts.reduce((total, shift) => total + shift.required, 0))"></span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Admin buttons and toggle always at the top -->
        <div class="flex items-center">
            <div x-show="isAdmin" class="hidden md:flex btn-group mr-2">
                <button @click.stop="openShiftModal(null, type); $event.stopPropagation();"
                        class="btn btn-square btn-outline btn-xs md:btn-sm btn-success mr-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 md:h-4 md:w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                    </svg>
                </button>
                <button @click.stop="openShiftTypeModal(type); $event.stopPropagation();"
                        class="btn btn-square btn-outline btn-xs md:btn-sm mr-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 md:h-4 md:w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                    </svg>
                </button>
                <button @click.stop="openDeleteShiftTypeModal(type); $event.stopPropagation();"
                        class="btn btn-square btn-outline btn-xs md:btn-sm text-error">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 md:h-4 md:w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m4-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                </button>
            </div>
            
            <!-- Admin buttons (mobile dropdown) - positioned to the left of the toggle -->
            <div x-show="isAdmin" class="md:hidden dropdown dropdown-end mr-2">
                <label tabindex="0" class="btn btn-sm btn-outline btn-square">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" />
                    </svg>
                </label>
                <ul tabindex="0" class="dropdown-content z-[1] menu p-2 shadow bg-base-100 rounded-box w-52">
                    <li>
                        <a @click.stop="openShiftModal(null, type); $event.stopPropagation();" class="text-success">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                            </svg>
                            <span x-text="$t('shift_plans.view.add_shift')"></span>
                        </a>
                    </li>
                    <li>
                        <a @click.stop="openShiftTypeModal(type); $event.stopPropagation();">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                            </svg>
                            <span x-text="$t('shift_plans.view.edit_shift_type')"></span>
                        </a>
                    </li>
                    <li>
                        <a @click.stop="openDeleteShiftTypeModal(type); $event.stopPropagation();" class="text-error">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m4-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                            <span x-text="$t('shift_plans.view.delete_shift_type')"></span>
                        </a>
                    </li>
                </ul>
            </div>
            
            <!-- Toggle Button for Type Card (always at the right edge) -->
            <button @click.stop="isTypeExpanded = !isTypeExpanded" class="btn btn-ghost btn-xs p-0 h-auto">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transition-transform duration-200" 
                     :class="{ 'rotate-180': isTypeExpanded }" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Content (only visible when expanded) -->
    <div x-show="isTypeExpanded" x-collapse>
        <!-- Description with toggle -->
        <div class="cursor-pointer" @click.stop>
            <div class="relative">
                <p x-ref="description" class="text-base-content/70 text-sm transition-all duration-200"
                   :class="{ 'line-clamp-3': !isDescriptionExpanded && isDescriptionLong }"
                   x-text="plan.is_multilingual ? ($locale() === 'de' ? type.description_de : type.description_en) : type.description_en">
                </p>
                
                <!-- Toggle Button for Description (only shown if description is actually long) -->
                <button 
                    @click.stop="isDescriptionExpanded = !isDescriptionExpanded; $event.stopPropagation();"
                    class="text-xs font-medium text-primary hover:text-primary-focus transition-colors mt-1 inline-flex items-center gap-1"
                    x-show="isDescriptionLong">
                    <span x-text="isDescriptionExpanded ? $t('common.show_less') : $t('common.show_more')">Mehr anzeigen</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 transition-transform duration-200" 
                         :class="{ 'rotate-180': isDescriptionExpanded }" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
            </div>
        </div>
        
        <!-- Location - only shown if defined -->
        <template x-if="(plan.is_multilingual ? (type.location_de || type.location_en) : type.location_en)">
            <p class="text-xs mt-1">
                <span class="font-semibold" x-text="$t('shift_plans.view.location')"></span>:
                <span
                    x-text="plan.is_multilingual ? ($locale() === 'de' ? type.location_de : type.location_en) : type.location_en"></span>
            </p>
        </template>

        <!-- Shifts grouped by date -->
        <template x-if="type.shifts && type.shifts.length > 0">
            <template x-for="dateGroup in groupShiftsByDate(type.shifts)" :key="dateGroup.date">
            <div class="mb-4 mt-3">
                <div class="flex items-center gap-2 mb-1 md:mb-2">
                    <h3 class="text-base font-medium" x-text="formatDate(dateGroup.date)"></h3>
                        <div class="flex-1 border-t-2 border-base-content/10"></div>
                </div>
                <div class="overflow-x-auto -mx-2 px-0 md:mx-0">
                        <table class="table table-xs w-full [&_td]:border-t [&_td]:!border-base-content/40">
                        <thead>
                            <tr>
                                    <th class="w-40 md:w-48 bg-base-200/50 px-2 md:px-4" x-text="$t('shift_plans.view.time')"></th>
                                    <th class="w-16 hidden md:table-cell bg-base-200/50" x-text="$t('shift_plans.view.duration')"></th>
                                    <th class="w-12 md:w-14 bg-base-200/50 text-center px-1 md:px-2">Status</th>
                                    <th class="bg-base-200/50 px-2 md:px-4" x-text="$t('shift_plans.view.participants')"></th>
                                    <th class="w-10 md:w-12 bg-base-200/50 px-1 md:px-2"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="shift in dateGroup.shifts" :key="shift.id">
                                    <tr x-data="{ isExpanded: false }" class="group hover:bg-base-300/50">
                                    <td class="align-middle px-2 md:px-4 py-1 md:py-2">
                                            <div class="whitespace-nowrap font-medium"
                                                x-text="formatTime(shift.start_time, shift.duration)"></div>
                                            <div class="text-xs text-base-content/60 mt-0.5"
                                                :class="{ 'line-clamp-1': !isExpanded }"
                                                x-text="plan.is_multilingual ? ($locale() === 'de' ? shift.comment_de : shift.comment_en) : shift.comment_en">
                                        </div>
                                    </td>
                                        <td class="whitespace-nowrap hidden md:table-cell align-middle"
                                            x-text="formatDuration(shift.duration)">
                                        </td>
                                        <td class="align-middle text-center px-1 md:px-2 py-1 md:py-2">
                                            <div class="radial-progress text-[10px]" 
                                                 x-bind:style="{ '--value': Math.round((shift.participants?.length || 0) / shift.required * 100), '--size': '1.8rem', '--thickness': '2.4px' }"
                                                 :class="{
                                                     'text-error': !shift.participants || shift.participants.length === 0,
                                                     'text-success': shift.participants?.length === shift.required,
                                                     'text-warning': shift.participants?.length < (shift.required * 0.5),
                                                     'text-primary': shift.participants && shift.participants.length < shift.required
                                                 }">
                                                <span x-text="(shift.participants?.length || 0) + '/' + shift.required"></span>
                                            </div>
                                        </td>
                                        <td class="py-1 md:py-2 px-2 md:px-4 align-middle">
                                            <div class="space-y-1 md:space-y-2">
                                                <div class="flex flex-wrap gap-0.5 md:gap-1.5">
                                                    <template x-for="participant in shift.participants || []" :key="participant.id">
                                                        <div class="inline-flex items-center gap-1 md:gap-1.5 px-1.5 md:px-2 py-0.5 bg-base-200 hover:bg-base-300 rounded-lg text-xs md:text-sm transition-colors border border-base-content/20">
                                                            <span x-text="participant.name" class="font-medium"></span>
                                                            <button @click.stop="openRemoveModal(shift, participant)"
                                                                    class="inline-flex items-center justify-center h-3.5 w-3.5 md:h-4 md:w-4 rounded hover:bg-base-content/10 text-base-content/70 hover:text-error transition-colors"
                                                                    :aria-label="$t('shift_plans.view.remove_participant')">
                                                                <svg xmlns="http://www.w3.org/2000/svg" class="h-2.5 w-2.5 md:h-3 md:w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                                                </svg>
                                                            </button>
                                                        </div>
                                                    </template>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="text-right align-middle px-1 md:px-2 py-1 md:py-2">
                                            <!-- Desktop Actions -->
                                            <div class="hidden md:flex justify-end items-center gap-1 md:gap-2">
                                                <button x-show="isAdmin"
                                                        @click="openShiftModal(shift, type)"
                                                        class="btn btn-square btn-outline btn-xs md:btn-sm">
                                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 md:h-4 md:w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                                                    </svg>
                                                </button>
                                                <button x-show="isAdmin"
                                                        @click="openDeleteShiftModal(shift, type)"
                                                        class="btn btn-square btn-outline btn-xs md:btn-sm btn-error">
                                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 md:h-4 md:w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m4-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                                    </svg>
                                                </button>
                                                <button @click="openJoinModal(shift)"
                                                    :disabled="shift.participants?.length >= shift.required"
                                                    class="btn btn-square btn-outline btn-success btn-xs md:btn-sm"
                                                    :class="{ 'btn-disabled': shift.participants?.length >= shift.required }"
                                                    :aria-label="$t('shift_plans.view.join')">
                                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 md:h-5 md:w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                                                    </svg>
                                                </button>
                                                <button x-show="isAdmin"
                                                        @click="openShiftModal(shift, type, true)"
                                                        class="btn btn-square btn-outline btn-xs md:btn-sm"
                                                        :aria-label="$t('shift_plans.view.duplicate_shift')"
                                                        :title="$t('shift_plans.view.duplicate_shift')">
                                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 md:h-4 md:w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2" />
                                                    </svg>
                                                </button>
                                                <button @click="isExpanded = !isExpanded"
                                                    x-show="plan.is_multilingual ? (shift.comment_de || shift.comment_en) : shift.comment_en"
                                                    class="btn btn-ghost btn-xs md:btn-sm btn-square"
                                                    :aria-expanded="isExpanded"
                                                    :aria-label="$t(isExpanded ? 'shift_plans.view.collapse_details' : 'shift_plans.view.expand_details')">
                                                    <svg xmlns="http://www.w3.org/2000/svg"
                                                        class="h-3 w-3 md:h-4 md:w-4 transition-transform duration-200"
                                                        :class="{ 'rotate-90': isExpanded }" fill="none"
                                                        viewBox="0 0 24 24" stroke="currentColor">
                                                        <path stroke-linecap="round" stroke-linejoin="round"
                                                            stroke-width="2" d="M9 5l7 7-7 7" />
                                                    </svg>
                                                </button>
                                            </div>
                                            
                                            <!-- Mobile Actions -->
                                            <div class="md:hidden flex justify-end items-center gap-1">
                                                <!-- Join Button (always visible) -->
                                                <button @click="openJoinModal(shift)"
                                                    :disabled="shift.participants?.length >= shift.required"
                                                    class="btn btn-square btn-outline btn-success btn-xs"
                                                    :class="{ 'btn-disabled': shift.participants?.length >= shift.required }"
                                                    :aria-label="$t('shift_plans.view.join')">
                                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                                                    </svg>
                                                </button>
                                                
                                                <!-- Comment Expand Button -->
                                                <button @click="isExpanded = !isExpanded"
                                                    x-show="plan.is_multilingual ? (shift.comment_de || shift.comment_en) : shift.comment_en"
                                                    class="btn btn-ghost btn-xs btn-square"
                                                    :aria-expanded="isExpanded"
                                                    :aria-label="$t(isExpanded ? 'shift_plans.view.collapse_details' : 'shift_plans.view.expand_details')">
                                                    <svg xmlns="http://www.w3.org/2000/svg"
                                                        class="h-3 w-3 transition-transform duration-200"
                                                        :class="{ 'rotate-90': isExpanded }" fill="none"
                                                        viewBox="0 0 24 24" stroke="currentColor">
                                                        <path stroke-linecap="round" stroke-linejoin="round"
                                                            stroke-width="2" d="M9 5l7 7-7 7" />
                                                    </svg>
                                                </button>
                                                
                                                <!-- Admin Actions Dropdown -->
                                                <div x-show="isAdmin" class="dropdown dropdown-end">
                                                    <label tabindex="0" class="btn btn-xs btn-outline btn-square">
                                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" />
                                                        </svg>
                                                    </label>
                                                    <ul tabindex="0" class="dropdown-content z-[1] menu p-2 shadow bg-base-100 rounded-box w-52">
                                                        <li>
                                                            <a @click="openShiftModal(shift, type)">
                                                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                                                                </svg>
                                                                <span x-text="$t('shift_plans.view.edit_shift')"></span>
                                                            </a>
                                                        </li>
                                                        <li>
                                                            <a @click="openShiftModal(shift, type, true)">
                                                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2" />
                                                                </svg>
                                                                <span x-text="$t('shift_plans.view.duplicate_shift')"></span>
                                                            </a>
                                                        </li>
                                                        <li>
                                                            <a @click="openDeleteShiftModal(shift, type)" class="text-error">
                                                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m4-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                                                </svg>
                                                                <span x-text="$t('shift_plans.view.delete_shift')"></span>
                                                            </a>
                                                        </li>
                                                    </ul>
                                                </div>
                                            </div>
                                        </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
            </template>
        </template>
    </div>
</div>
{{ end }}
