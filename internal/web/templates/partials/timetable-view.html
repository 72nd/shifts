{{ define "timetable-view" }}
<!-- Timetable View Container -->
<template x-if="isTimetableView">
    <div class="timetable-container">
        <template x-if="!timetableModel.hasAnyShifts">
            <div class="card card-bordered border-base-content/10 shadow">
                <div class="card-body p-4 text-sm text-base-content/70">
                    <div class="flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13 16h-1v-4h-1m1-4h.01M12 8v.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <span x-text="$t('shift_plans.view.timetable_empty')"></span>
                    </div>
                </div>
            </div>
        </template>

        <template x-if="timetableModel.hasAnyShifts">
            <div class="timetable-unified" 
                 x-ref="timetableContainer"
                 x-init="initTimetableActiveDay(); observeTimetableLayout()"
                 @scroll="handleTimetableScroll()">
                <!-- Day navigation bar (top, spans full width) -->
                <div class="timetable-day-navigation"
                     x-show="timetableModel.days.length > 0">
                    <template x-for="day in timetableModel.days" :key="`nav-${day.dateKey}`">
                        <button class="timetable-day-nav-tab"
                                :class="{ 'is-active': activeDayKey === day.dateKey }"
                                @click="scrollToDay(day.dateKey)"
                                x-text="day.dateLabel"></button>
                    </template>
                </div>

                <!-- Time header (top left) -->
                <div class="timetable-time-header-wrapper">
                    <div class="timetable-time-label" x-text="$t('shift_plans.view.time')"></div>
                </div>

                <!-- Type headers row (top right, sticky) -->
                <div class="timetable-type-headers"
                    x-show="timetableModel.days.length > 0"
                    :style="`grid-template-columns: repeat(${timetableModel.normalizedTypes.length}, minmax(200px, 1fr))`">
                    <template x-for="type in timetableModel.normalizedTypes" :key="`header-${type.id}`">
                        <div class="timetable-column-header">
                            <div class="flex items-center justify-between gap-2 text-sm font-medium">
                                <span x-text="type.title"></span>
                                <button x-show="isAdmin" 
                                    @click="openShiftTypeModal(shiftTypes.find(t => t.id === type.id))"
                                    class="btn btn-ghost btn-xs btn-circle opacity-60 hover:opacity-100"
                                    :title="$t('shift_plans.view.edit_shift_type')">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Time rail (bottom left) -->
                <div class="timetable-time-rail">
                    <!-- Time grid for all days combined -->
                    <div class="timetable-time-grid">
                        <template x-for="day in timetableModel.days" :key="`day-time-${day.dateKey}`">
                            <div class="timetable-time-day-section">
                                <template x-for="segment in day.segments" :key="`time-${day.dateKey}-${segment.key}`">
                                    <div>
                                        <template x-if="segment.kind === 'visible'">
                                            <div>
                                                <template x-for="(slot, index) in segment.slots" :key="`slot-${slot.minute}`">
                                                    <div class="timetable-time-slot"
                                                        :class="{ 'is-hour': slot.isHour, 'is-day-start': slot.minute === 0 }">
                                                        <span x-show="slot.isHour" x-text="slot.label"></span>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                        <!-- Empty stretch: pointer shortcut only, the button in the columns is the accessible one -->
                                        <template x-if="segment.kind === 'gap'">
                                            <div class="timetable-gap timetable-gap-rail" aria-hidden="true"
                                                :class="{ 'is-expanded': segment.expanded }"
                                                :title="segment.expanded ? $t('shift_plans.view.timetable_gap_hide', { from: segment.from, to: segment.to }) : $t('shift_plans.view.timetable_gap_show', { from: segment.from, to: segment.to })"
                                                @click="toggleTimetableGap(segment.key)">
                                                <svg x-show="!segment.expanded" xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 9l4-4 4 4m0 6l-4 4-4-4" />
                                                </svg>
                                                <svg x-show="segment.expanded" xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 7l4 4 4-4m0 10l-4-4-4 4" />
                                                </svg>
                                                <span x-show="!segment.expanded" x-text="$t('shift_plans.view.timetable_gap_short', { hours: segment.hours })"></span>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Columns wrapper (bottom right) -->
                <div class="timetable-columns-wrapper">
                    <!-- Days vertically stacked -->
                    <template x-for="day in timetableModel.days" :key="`day-section-${day.dateKey}`">
                        <div class="timetable-day-section"
                             :data-day-key="day.dateKey"
                             :style="`contain-intrinsic-size: auto calc(${day.visibleSlots} * var(--timetable-slot-height) + ${day.gapCount} * var(--timetable-gap-height))`">
                          <template x-for="segment in day.segments" :key="`seg-${day.dateKey}-${segment.key}`">
                           <div>
                            <!-- Empty stretch of the day, collapsed to a band (or the button to collapse it again) -->
                            <template x-if="segment.kind === 'gap'">
                                <button type="button" class="timetable-gap"
                                    :class="{ 'is-expanded': segment.expanded }"
                                    :aria-expanded="segment.expanded ? 'true' : 'false'"
                                    :aria-label="segment.expanded ? $t('shift_plans.view.timetable_gap_hide', { from: segment.from, to: segment.to }) : $t('shift_plans.view.timetable_gap_show', { from: segment.from, to: segment.to })"
                                    @click="toggleTimetableGap(segment.key)">
                                    <svg x-show="!segment.expanded" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 9l4-4 4 4m0 6l-4 4-4-4" />
                                    </svg>
                                    <svg x-show="segment.expanded" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 7l4 4 4-4m0 10l-4-4-4 4" />
                                    </svg>
                                    <span class="timetable-gap-label"
                                        x-text="segment.expanded ? $t('shift_plans.view.timetable_gap_hide', { from: segment.from, to: segment.to }) : $t('shift_plans.view.timetable_gap', { hours: segment.hours, from: segment.from, to: segment.to })"></span>
                                </button>
                            </template>
                            <!-- Columns grid for this part of the day -->
                            <template x-if="segment.kind === 'visible'">
                            <div class="timetable-columns"
                                :style="`grid-template-columns: repeat(${day.columns.length}, minmax(200px, 1fr))`">
                                <template x-for="column in segment.columns" :key="`col-${day.dateKey}-${segment.key}-${column.typeId}`">
                                    <div class="timetable-column">
                                        <div class="timetable-column-body"
                                            :style="`--segment-slots: ${segment.slotCount}`">
                                            <template x-if="!column.hasShifts && segment.isFirstVisible">
                                                <div class="timetable-column-empty" x-text="$t('shift_plans.view.timetable_empty_column')"></div>
                                            </template>

                                            <template x-for="shift in column.shifts" :key="shift.id">
                                                <div class="timetable-shift"
                                                    :style="getTimetableShiftStyle(shift)"
                                                    :data-fill-status="shift.fillStatus"
                                                    :data-shift-id="shift.id"
                                                    @click="hasShiftOverflow(shift.id) ? toggleTimetableShift(shift.id) : null"
                                                    @contextmenu="isAdmin ? handleTimetableShiftContextMenu(shift, $event) : null"
                                                    :class="{ 
                                                        'is-locked': shift.isLocked,
                                                        'shift-changed': isRecentlyChanged(shift.id),
                                                        'has-collision': shiftHasCollision(shift.id),
                                                        'is-expanded': isTimetableShiftExpanded(shift.id),
                                                        'has-overflow': hasShiftOverflow(shift.id)
                                                    }">
                                                    <!-- Content wrapper for overflow detection -->
                                                    <div class="timetable-shift-content">
                                                        <div class="timetable-shift-header">
                                                            <div class="timetable-shift-time">
                                                                <span x-text="shift.displayTime"></span>
                                                                <svg x-show="shift.isLocked" xmlns="http://www.w3.org/2000/svg"
                                                                    class="h-3.5 w-3.5 text-info inline-block ml-1" fill="none" viewBox="0 0 24 24"
                                                                    stroke="currentColor"
                                                                    :title="$t('shift_plans.view.shift_locked')">
                                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                                                                </svg>
                                                            </div>
                                                            <div class="timetable-shift-header-actions">
                                                                <div x-show="isAdmin" class="timetable-shift-admin-actions">
                                                                    <button @click.stop="handleTimetableShiftEdit(shift, column)"
                                                                        class="timetable-shift-admin-btn" title="Edit">
                                                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                                                                        </svg>
                                                                    </button>
                                                                    <button @click.stop="handleTimetableShiftDuplicate(shift, column)"
                                                                        class="timetable-shift-admin-btn" title="Duplicate">
                                                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                                                                        </svg>
                                                                    </button>
                                                                    <button @click.stop="handleTimetableShiftToggleLock(shift, column)"
                                                                        class="timetable-shift-admin-btn" :title="shift.isLocked ? 'Unlock' : 'Lock'">
                                                                        <svg x-show="!shift.isLocked" xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z" />
                                                                        </svg>
                                                                        <svg x-show="shift.isLocked" xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                                                                        </svg>
                                                                    </button>
                                                                    <button @click.stop="handleTimetableShiftDelete(shift, column)"
                                                                        class="timetable-shift-admin-btn timetable-shift-admin-btn-danger" title="Delete">
                                                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                                                        </svg>
                                                                    </button>
                                                                </div>
                                                                <button x-show="shift.canRegister" @click.stop="handleTimetableRegister(shift)"
                                                                    class="timetable-shift-register-btn" :title="$t('shift_plans.view.register')">
                                                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                                                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                                                                    </svg>
                                                                </button>
                                                                <div class="timetable-shift-fill">
                                                                    <span x-text="shift.fillText"></span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <div class="timetable-shift-participants">
                                                            <template x-if="shift.participants.length === 0">
                                                                <span class="timetable-shift-participants-empty"
                                                                    x-text="$t('shift_plans.view.timetable_no_participants')"></span>
                                                            </template>
                                                            <template x-for="participant in shift.participants" :key="participant.id">
                                                                <span class="timetable-shift-participant" 
                                                                    :title="participant.name"
                                                                    :class="{ 'has-remove': !shift.isLocked || isAdmin, 'has-collision': hasCollision(participant.name, shift.id) }"
                                                                    @click.stop="(!shift.isLocked || isAdmin) && handleTimetableParticipantRemove(shift, participant, $event)">
                                                                    <svg x-show="planHasStatuses && participant.status === 'assigned'" role="img"
                                                                         :aria-label="$t('shift_plans.view.status_assigned')" :title="$t('shift_plans.view.status_assigned')"
                                                                         xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 mr-1 inline-block text-success flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                                                                    </svg>
                                                                    <span x-text="participant.name"></span>
                                                                    <!-- Collision warning icon -->
                                                                    <svg x-show="hasCollision(participant.name, shift.id)"
                                                                         role="img"
                                                                         :aria-label="$t('shift_plans.view.participant_collision')"
                                                                         xmlns="http://www.w3.org/2000/svg"
                                                                         class="h-3 w-3 ml-1 inline-block text-warning flex-shrink-0"
                                                                         fill="none"
                                                                         viewBox="0 0 24 24"
                                                                         stroke="currentColor"
                                                                         :title="$t('shift_plans.view.participant_collision')">
                                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                                                                    </svg>
                                                                    <svg x-show="!shift.isLocked || isAdmin" xmlns="http://www.w3.org/2000/svg"
                                                                        class="h-3 w-3 ml-1 inline-block opacity-60 hover:opacity-100"
                                                                        fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                                            d="M6 18L18 6M6 6l12 12" />
                                                                    </svg>
                                                                </span>
                                                            </template>
                                                            <!-- Declined participations (only on request) -->
                                                            <template x-if="filterManager.showDeclined">
                                                                <template x-for="participant in shift.declinedParticipants" :key="participant.id">
                                                                    <span class="timetable-shift-participant opacity-70"
                                                                        :class="{ 'has-remove': isAdmin }"
                                                                        :title="$t('shift_plans.view.status_declined')"
                                                                        @click.stop="isAdmin && handleTimetableParticipantRemove(shift, participant, $event)">
                                                                        <svg role="img" :aria-label="$t('shift_plans.view.status_declined')" xmlns="http://www.w3.org/2000/svg"
                                                                             class="h-3 w-3 mr-1 inline-block flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
                                                                        </svg>
                                                                        <span class="line-through" x-text="participant.name"></span>
                                                                    </span>
                                                                </template>
                                                            </template>
                                                        </div>
                                                        <div class="timetable-shift-comment" x-show="shift.comment">
                                                            <div x-show="!isTimetableShiftExpanded(shift.id)" 
                                                                class="timetable-shift-comment-truncated md-content"
                                                                x-html="shift.commentHtml || shift.comment"></div>
                                                            <div x-show="isTimetableShiftExpanded(shift.id)" 
                                                                class="timetable-shift-comment-full md-content"
                                                                x-html="shift.commentHtml || shift.comment"></div>
                                                        </div>
                                                        <!-- Locked shift explanation -->
                                                        <div x-show="shift.isLocked" 
                                                             class="timetable-locked-shift-comment text-info text-xs mt-2"
                                                             x-text="$t('shift_plans.view.shift_locked_explanation')"></div>
                                                    </div>
                                                    <!-- Expand indicator - only show when content overflows -->
                                                    <div class="timetable-shift-expand-hint" 
                                                        x-show="hasShiftOverflow(shift.id) && !isTimetableShiftExpanded(shift.id)"
                                                        @click.stop="toggleTimetableShift(shift.id)">
                                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                                                        </svg>
                                                    </div>
                                                    <!-- Collapse indicator when expanded -->
                                                    <div class="timetable-shift-collapse-hint" 
                                                        x-show="hasShiftOverflow(shift.id) && isTimetableShiftExpanded(shift.id)"
                                                        @click.stop="toggleTimetableShift(shift.id)">
                                                        <span x-text="$t('common.show_less')"></span>
                                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" />
                                                        </svg>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                            </template>
                           </div>
                          </template>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </div>
</template>
{{ end }}
