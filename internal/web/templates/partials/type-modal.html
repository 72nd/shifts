{{ define "shift-type-modal" }}
<dialog id="shift_type_modal" class="modal">
    <div class="modal-box max-w-2xl">
        <h3 class="font-bold text-lg mb-2" x-text="shiftTypeModal.currentType ? $t('shift_plans.view.edit_shift_type') : $t('shift_plans.view.add_shift_type')"></h3>
        
        <!-- Error Message Box -->
        <div x-show="shiftTypeModal.errors.general" class="alert alert-error mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span x-text="shiftTypeModal.errors.general"></span>
        </div>
        
        <form method="dialog" class="space-y-3" @submit.prevent="shiftTypeModal.submit()">
            <!-- Title Fields -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <template x-if="plan.is_multilingual">
                    <div class="form-control w-full">
                        <label class="label py-0">
                            <span class="label-text font-medium" x-text="$t('shift_plans.view.title_de')"></span>
                        </label>
                        <input type="text" x-model="shiftTypeModal.title_de" 
                               class="input input-bordered input-sm w-full" 
                               :class="{ 'input-error': shiftTypeModal.errors.title_de }"
                               required />
                        <label class="label py-0" x-show="shiftTypeModal.errors.title_de">
                            <span class="label-text-alt text-error" x-text="shiftTypeModal.errors.title_de"></span>
                        </label>
                    </div>
                </template>
                
                <div class="form-control w-full" :class="{ 'md:col-span-2': !plan.is_multilingual }">
                    <label class="label py-0">
                        <span class="label-text font-medium" x-text="plan.is_multilingual ? $t('shift_plans.view.title_en') : $t('shift_plans.view.title')"></span>
                    </label>
                    <input type="text" x-model="shiftTypeModal.title_en" 
                           class="input input-bordered input-sm w-full"
                           :class="{ 'input-error': shiftTypeModal.errors.title_en }"
                           required />
                    <label class="label py-0" x-show="shiftTypeModal.errors.title_en">
                        <span class="label-text-alt text-error" x-text="shiftTypeModal.errors.title_en"></span>
                    </label>
                </div>
            </div>

            <!-- Description Fields -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <template x-if="plan.is_multilingual">
                    <div class="form-control w-full">
                        <label class="label py-0">
                            <span class="label-text font-medium" x-text="$t('shift_plans.view.description_de')"></span>
                        </label>
                        <textarea x-model="shiftTypeModal.description_de" 
                                  class="textarea textarea-bordered textarea-sm w-full h-16"
                                  :class="{ 'textarea-error': shiftTypeModal.errors.description_de }"
                                  required></textarea>
                        <label class="label py-0" x-show="shiftTypeModal.errors.description_de">
                            <span class="label-text-alt text-error" x-text="shiftTypeModal.errors.description_de"></span>
                        </label>
                    </div>
                </template>
                
                <div class="form-control w-full" :class="{ 'md:col-span-2': !plan.is_multilingual }">
                    <label class="label py-0">
                        <span class="label-text font-medium" x-text="plan.is_multilingual ? $t('shift_plans.view.description_en') : $t('shift_plans.view.description')"></span>
                    </label>
                    <textarea x-model="shiftTypeModal.description_en" 
                              class="textarea textarea-bordered textarea-sm w-full h-16"
                              :class="{ 'textarea-error': shiftTypeModal.errors.description_en }"
                              required></textarea>
                    <label class="label py-0" x-show="shiftTypeModal.errors.description_en">
                        <span class="label-text-alt text-error" x-text="shiftTypeModal.errors.description_en"></span>
                    </label>
                </div>
            </div>

            <!-- Location Fields -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <template x-if="plan.is_multilingual">
                    <div class="form-control w-full">
                        <label class="label py-0">
                            <span class="label-text font-medium" x-text="$t('shift_plans.view.location_de')"></span>
                        </label>
                        <input type="text" x-model="shiftTypeModal.location_de" 
                               class="input input-bordered input-sm w-full"
                               :class="{ 'input-error': shiftTypeModal.errors.location_de }"
                               required />
                        <label class="label py-0" x-show="shiftTypeModal.errors.location_de">
                            <span class="label-text-alt text-error" x-text="shiftTypeModal.errors.location_de"></span>
                        </label>
                    </div>
                </template>
                
                <div class="form-control w-full" :class="{ 'md:col-span-2': !plan.is_multilingual }">
                    <label class="label py-0">
                        <span class="label-text font-medium" x-text="plan.is_multilingual ? $t('shift_plans.view.location_en') : $t('shift_plans.view.location')"></span>
                    </label>
                    <input type="text" x-model="shiftTypeModal.location_en" 
                           class="input input-bordered input-sm w-full"
                           :class="{ 'input-error': shiftTypeModal.errors.location_en }"
                           required />
                    <label class="label py-0" x-show="shiftTypeModal.errors.location_en">
                        <span class="label-text-alt text-error" x-text="shiftTypeModal.errors.location_en"></span>
                    </label>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex justify-end gap-2 mt-6 pt-4 border-t border-base-content/20">
                <button type="button" 
                        @click="shiftTypeModal.close()" 
                        class="btn btn-sm" 
                        x-text="$t('common.cancel')">
                </button>
                <button type="submit" 
                        class="btn btn-sm btn-primary" 
                        x-text="shiftTypeModal.currentType ? $t('common.save') : $t('common.create')">
                </button>
            </div>
        </form>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button @click="shiftTypeModal.close()">close</button>
    </form>
</dialog>
{{ end }}
