<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-title" content="Shifts" />
    
    <!-- Default OpenGraph Meta Tags -->
    <meta property="og:site_name" content="Shifts">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/static/img/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    
    <!-- Template block for page-specific meta tags -->
    {{ block "meta" . }}
    <title>Shifts - Shift Planning Made Easy</title>
    <meta property="og:title" content="Shifts - Shift Planning Made Easy">
    <meta property="og:description" content="Create and manage shift plans collaboratively. Perfect for events, volunteer work, and team organization.">
    <meta name="description" content="Create and manage shift plans collaboratively. Perfect for events, volunteer work, and team organization.">
    {{ end }}
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/static/img/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg" />
    <link rel="shortcut icon" href="/static/img/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/img/apple-touch-icon.png" />
    <link rel="manifest" href="/static/site.webmanifest" />
    
    <!-- DaisyUI -->
    <link href="/static/vendor/daisyui.min.css" rel="stylesheet">

    
    <!-- Tailwind (must be after DaisyUI) -->
    <script src="/static/vendor/tailwind.min.js"></script>

    <link href="/static/vendor/style.css" rel="stylesheet">
    
    <!-- Alpine Plugins -->
    <script defer src="/static/vendor/alpine-sort.min.js"></script>
    <script defer src="/static/vendor/alpine-i18n.min.js"></script>
    
    <!-- Theme initialization (must be before Alpine) -->
    <script>
        // Check for saved theme preference or default to 'light'
        const theme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);

        // Initialize theme toggle
        document.addEventListener('DOMContentLoaded', () => {
            const themeController = document.querySelector('.theme-controller');
            if (themeController) {
                // Set initial state
                themeController.checked = theme === 'dark';
                
                // Add change listener
                themeController.addEventListener('change', (e) => {
                    const newTheme = e.target.checked ? 'dark' : 'light';
                    document.documentElement.setAttribute('data-theme', newTheme);
                    localStorage.setItem('theme', newTheme);
                });
            }
        });
    </script>
    
    <!-- Initialize translations -->
    <script>
        // Wait for Alpine and i18n plugin to load
        document.addEventListener('alpine:init', () => {
            // Default locale
            const locale = localStorage.getItem('locale') || 'de';
            
            // Load translations
            Promise.all([
                fetch('/static/i18n/de.json').then(r => r.json()),
                fetch('/static/i18n/en.json').then(r => r.json())
            ]).then(([de, en]) => {
                // Initialize AlpineI18n with translations
                window.AlpineI18n.create(locale, {
                    de,
                    en
                });
                
                // Set fallback locale
                window.AlpineI18n.fallbackLocale = 'en';
                
                // Listen to locale changes to persist in localStorage
                document.addEventListener('alpine-i18n:locale-change', () => {
                    localStorage.setItem('locale', window.AlpineI18n.locale);
                });
            });
        });
    </script>
    
    <!-- Tailwind configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {}
            },
            daisyui: {
                themes: ["light", "dark"],
            }
        }
    </script>

    <!-- Custom styles -->
    <style type="text/tailwindcss">
        @layer components {
            .container {
                @apply mx-auto px-4 max-w-7xl;
            }
        }
    </style>
</head>
