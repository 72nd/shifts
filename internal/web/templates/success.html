{{ template "base.html" . }}

{{ define "content" }}
<div class="hero bg-base-200 rounded-box">
    <div class="hero-content text-center py-6">
        <div class="max-w-md">
            <h1 class="text-4xl font-bold" x-text="$t('shift_plans.success.hero_title')">Shift Plan Successfully Created!</h1>
            <p class="mt-2" x-text="$t('shift_plans.success.hero_subtitle')">Please save the following information securely</p>
        </div>
    </div>
</div>

<div class="container mx-auto px-4 mt-6">
    <div class="max-w-2xl mx-auto space-y-6" x-data="{
        planUrl: window.location.origin + '{{ .Data.url }}',
        adminPassword: '{{ .Data.password }}',

        async copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
                // TODO: Show success toast
            } catch (error) {
                console.error('Failed to copy:', error);
                // TODO: Show error toast
            }
        }
    }">
        <div class="alert alert-warning">
            <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <span x-text="$t('shift_plans.success.warning')">IMPORTANT: Make sure to save the URL and password!</span>
        </div>

        <!-- Plan URL -->
        <div class="form-control">
            <label class="label">
                <span class="label-text" x-text="$t('shift_plans.success.plan_url')">Shift Plan URL</span>
            </label>
            <div class="join w-full">
                <input type="text" x-model="planUrl" class="input input-bordered join-item flex-1" readonly />
                <button @click="copyToClipboard(planUrl)" class="btn join-item">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M8 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z" />
                        <path d="M6 3a2 2 0 00-2 2v11a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2 3 3 0 01-3 3H9a3 3 0 01-3-3z" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Admin Password -->
        <div class="form-control">
            <label class="label">
                <span class="label-text" x-text="$t('shift_plans.success.admin_password')">Administrator Password</span>
            </label>
            <div class="join w-full">
                <input type="text" x-model="adminPassword" class="input input-bordered join-item flex-1" readonly />
                <button @click="copyToClipboard(adminPassword)" class="btn join-item">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M8 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z" />
                        <path d="M6 3a2 2 0 00-2 2v11a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2 3 3 0 01-3 3H9a3 3 0 01-3-3z" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="flex justify-center gap-4">
            <a :href="planUrl" class="btn btn-primary">
                <span x-text="$t('shift_plans.success.view_plan')">View Shift Plan</span>
            </a>
            <button @click="window.print()" class="btn">
                <span x-text="$t('shift_plans.success.print')">Print</span>
            </button>
        </div>
    </div>
</div>
{{ end }}
