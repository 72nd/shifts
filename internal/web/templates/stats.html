{{ template "base.html" . }}

{{ define "content" }}
<div x-data="shiftPlanStats" class="container mx-auto p-4 space-y-4">
    <header class="space-y-1 min-w-0">
        <a :href="backUrl()" class="link link-hover inline-flex items-center gap-1 min-h-11 text-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
            <span x-text="$t('stats.back_to_plan')"></span>
        </a>
        <h1 class="text-2xl font-bold min-w-0">
            <span class="block truncate" x-text="planTitle()" :title="planTitle()"></span>
            <span class="block text-base font-normal text-base-content/70" x-text="$t('stats.title')"></span>
        </h1>
    </header>

    <div class="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-3">
        <div class="min-w-0">
            {{ template "page-tabs" . }}
        </div>
        <div x-show="plan && !error">
            {{ template "stats-filters" . }}
        </div>
    </div>

    <div x-show="isLoading" class="flex justify-center items-center min-h-[50vh]">
        <span class="loading loading-spinner loading-lg"></span>
    </div>

    <div x-show="!isLoading && error" role="alert" class="alert alert-error">
        <span x-text="$t('stats.error_load')"></span>
        <button type="button" class="btn btn-sm" @click="load()" x-text="$t('stats.reload')"></button>
    </div>

    <template x-if="!isLoading && !error && model">
        <div>
            <section role="tabpanel" id="stats-panel-overview" aria-labelledby="stats-tab-overview" x-show="tab === 'overview'">
                {{ template "stats-overview" . }}
            </section>
            <section role="tabpanel" id="stats-panel-people" aria-labelledby="stats-tab-people" x-show="tab === 'people'">
                {{ template "stats-people" . }}
            </section>
            <section role="tabpanel" id="stats-panel-history" aria-labelledby="stats-tab-history" x-show="tab === 'history'">
                {{ template "stats-history" . }}
            </section>
            <section role="tabpanel" id="stats-panel-recap" aria-labelledby="stats-tab-recap" x-show="tab === 'recap'">
                {{ template "stats-recap" . }}
            </section>
        </div>
    </template>
</div>
{{ end }}

{{ define "scripts" }}
<script type="module" src="/static/js/stats/overview.js"></script>
<script type="module" src="/static/js/stats/people.js"></script>
<script type="module" src="/static/js/stats/history.js"></script>
<script type="module" src="/static/js/stats/recap.js"></script>
<script type="module" src="/static/js/shift-plan-stats.js"></script>
{{ end }}
