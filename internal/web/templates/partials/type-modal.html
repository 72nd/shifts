{{ define "shift-type-modal" }}
<dialog id="shift_type_modal" class="modal">
    <div class="modal-box max-w-2xl">
        <h3 class="font-bold text-lg mb-2">
            <span  x-text="shiftTypeModal.currentType ? $t('shift_plans.view.edit_shift_type') : $t('shift_plans.view.add_shift_type')"></span>
            <template x-if="shiftTypeModal.currentType">
                <span x-text="` [${shiftTypeModal.currentType.id}]`"></span>
            </template>
        </h3>
        
        <!-- Include error display component with the shiftTypeModal prefix -->
        {{ template "error-display" "shiftTypeModal" }}
        
        <form method="dialog" class="space-y-3" @submit.prevent="shiftTypeModal.submit()">
            <!-- Title Fields -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <template x-if="plan.is_multilingual">
                    <div class="form-control w-full">
                        <label class="label py-0">
                            <span class="label-text font-medium" x-text="$t('shift_plans.view.title_de')"></span>
                        </label>
                        <input type="text" x-model="shiftTypeModal.title_de" 
                               class="input input-bordered input-sm w-full" 
                               :class="{ 'input-error': shiftTypeModal.errors.title_de }"
                               required />
                        <label class="label py-0" x-show="shiftTypeModal.errors.title_de">
                            <span class="label-text-alt text-error" x-text="shiftTypeModal.errors.title_de"></span>
                        </label>
                    </div>
                </template>
                
                <div class="form-control w-full" :class="{ 'md:col-span-2': !plan.is_multilingual }">
                    <label class="label py-0">
                        <span class="label-text font-medium" x-text="plan.is_multilingual ? $t('shift_plans.view.title_en') : $t('shift_plans.view.title')"></span>
                    </label>
                    <input type="text" x-model="shiftTypeModal.title_en" 
                           class="input input-bordered input-sm w-full"
                           :class="{ 'input-error': shiftTypeModal.errors.title_en }"
                           required />
                    <label class="label py-0" x-show="shiftTypeModal.errors.title_en">
                        <span class="label-text-alt text-error" x-text="shiftTypeModal.errors.title_en"></span>
                    </label>
                </div>
            </div>

            <!-- Description Fields -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <template x-if="plan.is_multilingual">
                    <div class="form-control w-full">
                        <label class="label py-0">
                            <span class="label-text font-medium" x-text="$t('shift_plans.view.description_de')"></span>
                            <span class="label-text-alt opacity-60" x-text="$t('common.optional')"></span>
                        </label>
                        <textarea x-model="shiftTypeModal.description_de" 
                                  class="textarea textarea-bordered textarea-sm w-full h-16"
                                  :class="{ 'textarea-error': shiftTypeModal.errors.description_de }"></textarea>
                        <label class="label py-0" x-show="shiftTypeModal.errors.description_de">
                            <span class="label-text-alt text-error" x-text="shiftTypeModal.errors.description_de"></span>
                        </label>
                    </div>
                </template>
                
                <div class="form-control w-full" :class="{ 'md:col-span-2': !plan.is_multilingual }">
                    <label class="label py-0">
                        <span class="label-text font-medium" x-text="plan.is_multilingual ? $t('shift_plans.view.description_en') : $t('shift_plans.view.description')"></span>
                        <span class="label-text-alt opacity-60" x-text="$t('common.optional')"></span>
                    </label>
                    <textarea x-model="shiftTypeModal.description_en" 
                              class="textarea textarea-bordered textarea-sm w-full h-16"
                              :class="{ 'textarea-error': shiftTypeModal.errors.description_en }"></textarea>
                    <label class="label py-0" x-show="shiftTypeModal.errors.description_en">
                        <span class="label-text-alt text-error" x-text="shiftTypeModal.errors.description_en"></span>
                    </label>
                </div>
            </div>

            <!-- Location Fields -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <template x-if="plan.is_multilingual">
                    <div class="form-control w-full">
                        <label class="label py-0">
                            <span class="label-text font-medium" x-text="$t('shift_plans.view.location_de')"></span>
                            <span class="label-text-alt opacity-60" x-text="$t('common.optional')"></span>
                        </label>
                        <input type="text" x-model="shiftTypeModal.location_de" 
                               class="input input-bordered input-sm w-full"
                               :class="{ 'input-error': shiftTypeModal.errors.location_de }" />
                        <label class="label py-0" x-show="shiftTypeModal.errors.location_de">
                            <span class="label-text-alt text-error" x-text="shiftTypeModal.errors.location_de"></span>
                        </label>
                    </div>
                </template>
                
                <div class="form-control w-full" :class="{ 'md:col-span-2': !plan.is_multilingual }">
                    <label class="label py-0">
                        <span class="label-text font-medium" x-text="plan.is_multilingual ? $t('shift_plans.view.location_en') : $t('shift_plans.view.location')"></span>
                        <span class="label-text-alt opacity-60" x-text="$t('common.optional')"></span>
                    </label>
                    <input type="text" x-model="shiftTypeModal.location_en" 
                           class="input input-bordered input-sm w-full"
                           :class="{ 'input-error': shiftTypeModal.errors.location_en }" />
                    <label class="label py-0" x-show="shiftTypeModal.errors.location_en">
                        <span class="label-text-alt text-error" x-text="shiftTypeModal.errors.location_en"></span>
                    </label>
                </div>
            </div>

            <!-- Coordination settings (collapsed) -->
            <details class="group mt-3 border-t border-base-content/20 pt-2" x-show="plan.coordination_enabled">
                <summary class="min-h-11 flex flex-wrap items-center gap-x-2 cursor-pointer font-medium">
                    <span x-text="$t('coord.section')"></span>
                    <span class="text-sm font-normal text-base-content/60" x-text="shiftTypeModal.coordSummary()"></span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-auto shrink-0 transition-transform group-open:rotate-180 motion-reduce:transition-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </summary>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-2">
                    <div class="form-control">
                        <label class="label py-1"><span class="label-text font-medium" x-text="$t('coord.load_factor')"></span></label>
                        <input type="text" inputmode="decimal" x-model="shiftTypeModal.load_factor" class="input input-bordered input-sm w-full"
                               :class="{ 'input-error': shiftTypeModal.errors.load_factor }" />
                        <label class="label py-0" x-show="shiftTypeModal.errors.load_factor">
                            <span class="label-text-alt text-error" x-text="shiftTypeModal.errors.load_factor"></span>
                        </label>
                    </div>
                    <div class="form-control">
                        <label class="label py-1"><span class="label-text font-medium" x-text="$t('coord.popularity')"></span></label>
                        <select x-model="shiftTypeModal.popularity" class="select select-bordered select-sm w-full">
                            <option value="auto" x-text="$t('coord.popularity_auto')"></option>
                            <option value="popular" x-text="$t('coord.popularity_popular')"></option>
                            <option value="very_popular" x-text="$t('coord.popularity_very_popular')"></option>
                            <option value="normal" x-text="$t('coord.popularity_normal')"></option>
                        </select>
                    </div>
                    <fieldset class="sm:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-3" x-show="experienceOptions().length">
                        <legend class="label-text font-medium py-1" x-text="$t('coord.exp_need')"></legend>
                        <div class="form-control">
                            <label class="label py-1"><span class="label-text" x-text="$t('coord.exp_min_count')"></span></label>
                            <input type="number" min="0" x-model.number="shiftTypeModal.exp_min_count" class="input input-bordered input-sm w-full" />
                        </div>
                        <div class="form-control">
                            <label class="label py-1"><span class="label-text" x-text="$t('coord.exp_min_level')"></span></label>
                            <select x-model="shiftTypeModal.exp_min_level" class="select select-bordered select-sm w-full">
                                <option value="" x-text="$t('coord.field_unset')"></option>
                                <template x-for="o in experienceOptions()" :key="o.id">
                                    <option :value="o.id" :selected="shiftTypeModal.exp_min_level === o.id" x-text="optionLabel(o)"></option>
                                </template>
                            </select>
                        </div>
                    </fieldset>
                </div>
            </details>

            <!-- Action Buttons -->
            <div class="flex justify-end gap-2 mt-6">
                <button type="button" 
                        @click="shiftTypeModal.close()" 
                        class="btn btn-sm" 
                        x-text="$t('common.cancel')">
                </button>
                <button type="submit" 
                        class="btn btn-sm btn-primary" 
                        x-text="shiftTypeModal.currentType ? $t('common.save') : $t('common.create')">
                </button>
            </div>
        </form>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button @click="shiftTypeModal.close()">close</button>
    </form>
</dialog>
{{ end }}
