{{ define "coord-person-modal" }}
<div x-data="coordPersonModal" @coord-person.window="open($event.detail, $data, $refs.dlg)">
    <dialog x-ref="dlg" class="modal">
        <div class="modal-box">
            <h3 class="font-bold text-lg mb-2" x-text="isNew ? $t('coord.people_add') : originalName"></h3>
            {{ template "error-display" "modalError" }}

            <form class="space-y-3" @submit.prevent="save($data, $refs.dlg)">
                <label class="flex flex-col gap-1">
                    <span class="text-sm" x-text="$t('coord.col_name')"></span>
                    <input type="text" class="input input-bordered w-full h-11" maxlength="20" required x-model="form.name" autocomplete="off">
                </label>

                <div class="alert alert-warning" role="alert" x-show="mergeAsk">
                    <span x-text="$t('coord.person_merge_question', { name: form.name.trim() })"></span>
                    <button type="button" class="btn btn-sm min-h-11" :disabled="busy" @click="save($data, $refs.dlg, true)" x-text="$t('coord.person_merge')"></button>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" x-show="plan.attendance_mode !== 'off'">
                    <label class="flex flex-col gap-1 min-w-0">
                        <span class="text-sm" x-text="$t('coord.present_from')"></span>
                        <input type="datetime-local" class="input input-bordered w-full h-11" x-model="form.from">
                    </label>
                    <label class="flex flex-col gap-1 min-w-0">
                        <span class="text-sm" x-text="$t('coord.present_until')"></span>
                        <input type="datetime-local" class="input input-bordered w-full h-11" x-model="form.until">
                    </label>
                </div>

                <label class="flex flex-col gap-1 sm:max-w-40">
                    <span class="text-sm" x-text="$t('coord.target_hours')"></span>
                    <input type="text" inputmode="decimal" class="input input-bordered w-full h-11" x-model="form.targetHours"
                        :placeholder="plan.default_target_minutes != null ? number(plan.default_target_minutes / 60) : ''">
                </label>

                <label class="flex items-center gap-2 min-h-11 cursor-pointer">
                    <input type="checkbox" class="checkbox checkbox-sm" x-model="form.prefersLongDays">
                    <span x-text="$t('coord.prefers_long_days')"></span>
                </label>

                <template x-for="f in plan.fields" :key="f.id">
                    <div>
                        <label class="flex flex-col gap-1" x-show="f.kind === 'choice'">
                            <span class="text-sm" x-text="fieldLabel(f)"></span>
                            <select class="select select-bordered w-full h-11" x-model="form.values[f.id]">
                                <option value="" x-text="$t('coord.field_unset')"></option>
                                <template x-for="o in f.options" :key="o.id">
                                    <option :value="o.id" x-text="t(o)"></option>
                                </template>
                            </select>
                        </label>
                        <label class="flex flex-col gap-1 sm:max-w-40" x-show="f.kind === 'number'">
                            <span class="text-sm" x-text="fieldLabel(f)"></span>
                            <input type="number" step="0.1" class="input input-bordered w-full h-11" x-model.number="form.values[f.id]">
                        </label>
                        <label class="flex items-center gap-2 min-h-11 cursor-pointer" x-show="f.kind === 'boolean'">
                            <input type="checkbox" class="checkbox checkbox-sm" x-model="form.values[f.id]">
                            <span x-text="fieldLabel(f)"></span>
                        </label>
                        <label class="flex flex-col gap-1" x-show="f.kind === 'text'">
                            <span class="text-sm" x-text="fieldLabel(f)"></span>
                            <input type="text" maxlength="200" class="input input-bordered w-full h-11" x-model="form.values[f.id]" autocomplete="off">
                        </label>
                    </div>
                </template>

                <div class="flex flex-wrap justify-end gap-2 mt-6 pt-4 border-t border-base-content/20">
                    <template x-if="hasRow">
                        <div class="mr-auto">
                            <button type="button" class="btn btn-sm btn-error btn-outline min-h-11" x-show="!confirmDelete" @click="confirmDelete = true" x-text="$t('coord.person_delete')"></button>
                            <div class="flex flex-wrap items-center gap-2" x-show="confirmDelete">
                                <span class="text-sm" x-text="$t('coord.person_delete_confirm', { name: originalName })"></span>
                                <button type="button" class="btn btn-sm btn-error min-h-11" :disabled="busy" @click="remove($data, $refs.dlg)" x-text="$t('common.delete')"></button>
                            </div>
                        </div>
                    </template>
                    <button type="button" class="btn btn-sm min-h-11" @click="close($data, $refs.dlg)" x-text="$t('common.cancel')"></button>
                    <button type="submit" class="btn btn-sm btn-primary min-h-11" :disabled="busy || !form.name.trim()" x-text="$t('common.save')"></button>
                </div>
            </form>
        </div>
        <form method="dialog" class="modal-backdrop">
            <button @click="clearErrors()">close</button>
        </form>
    </dialog>
</div>
{{ end }}
