<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Config.Title}} – <span data-i18n="shift_planning">Schichtplanung</span></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/styles.css" rel="stylesheet">
    {{block "head" .}}{{end}}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-3">
        <div class="container">
            <a class="navbar-brand" href="/">
                <span class="fw-bold">{{.Config.Title}}</span> – <span data-i18n="shift_planning">Schichtplanung</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <div class="ms-auto d-flex align-items-center">
                    <div class="btn-group me-3">
                        <button class="btn btn-outline-secondary language-btn active" data-language="de" onclick="setLanguage('de')">DE</button>
                        <button class="btn btn-outline-secondary language-btn" data-language="en" onclick="setLanguage('en')">EN</button>
                    </div>
                    <div>
                        <button id="adminLoginBtn" class="btn btn-outline-primary" onclick="showAdminLogin()" data-i18n="admin_login">
                            Admin Login
                        </button>
                        <button id="adminLogoutBtn" class="btn btn-outline-danger" onclick="logoutAdmin()" style="display: none;" data-i18n="admin_logout">
                            Admin Logout
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        {{block "content" .}}{{end}}
    </div>

    {{block "modals" .}}{{end}}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/uuid@8.3.2/dist/umd/uuidv4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script type="module" src="/static/js/main.js"></script>
    <script>
        // Handle modal focus
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('shown.bs.modal', () => {
                // Find and focus the first input, select, or textarea
                const firstInput = modal.querySelector('input:not([type="hidden"]), select, textarea');
                if (firstInput) {
                    firstInput.focus();
                }
            });
        });
    </script>
    {{block "scripts" .}}{{end}}
</body>
</html>
