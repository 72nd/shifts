<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schipla</title>
    
    <!-- DaisyUI -->
    <link href="/static/vendor/daisyui.min.css" rel="stylesheet">
    
    <!-- Tailwind (must be after DaisyUI) -->
    <script src="/static/vendor/tailwind.min.js"></script>
    
    <!-- Theme initialization (must be before Alpine) -->
    <script>
        // Check for saved theme preference or default to 'light'
        const theme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);

        // Initialize theme toggle
        document.addEventListener('DOMContentLoaded', () => {
            const themeController = document.querySelector('.theme-controller');
            if (themeController) {
                // Set initial state
                themeController.checked = theme === 'dark';
                
                // Add change listener
                themeController.addEventListener('change', (e) => {
                    const newTheme = e.target.checked ? 'dark' : 'light';
                    document.documentElement.setAttribute('data-theme', newTheme);
                    localStorage.setItem('theme', newTheme);
                });
            }
        });
    </script>
    
    <!-- Alpine.js and plugins -->
    <script defer src="/static/vendor/alpine-i18n.min.js"></script>
    
    <!-- Initialize translations -->
    <script>
        // Wait for Alpine and i18n plugin to load
        document.addEventListener('alpine:init', () => {
            // Default locale
            const locale = localStorage.getItem('locale') || 'de';
            
            // Load translations
            Promise.all([
                fetch('/static/i18n/de.json').then(r => r.json()),
                fetch('/static/i18n/en.json').then(r => r.json())
            ]).then(([de, en]) => {
                // Initialize AlpineI18n with translations
                window.AlpineI18n.create(locale, {
                    de,
                    en
                });
                
                // Set fallback locale
                window.AlpineI18n.fallbackLocale = 'en';
                
                // Listen to locale changes to persist in localStorage
                document.addEventListener('alpine-i18n:locale-change', () => {
                    localStorage.setItem('locale', window.AlpineI18n.locale);
                });
            });
        });
    </script>
    
    <!-- Tailwind configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {}
            },
            daisyui: {
                themes: ["light", "dark"],
            }
        }
    </script>

    <!-- Custom styles -->
    <style type="text/tailwindcss">
        @layer components {
            .container {
                @apply mx-auto px-4 max-w-7xl;
            }
        }
    </style>
</head>
<body class="min-h-screen bg-base-100" x-data>
    <!-- Navigation -->
    <nav class="navbar bg-base-200">
        <div class="container">
            <div class="flex-1">
                <a href="/" class="text-xl font-semibold" x-text="$t('nav.home')">Home</a>
            </div>
            <div class="flex items-center gap-2">
                <!-- Language selector -->
                <div class="dropdown dropdown-end">
                    <label tabindex="0" class="btn btn-ghost normal-case">
                        <span x-text="$t('common.language')">Language</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </label>
                    <ul tabindex="0" class="dropdown-content menu p-2 shadow bg-base-100 rounded-box w-52">
                        <li><a @click="$locale('de')" :class="{ 'active': $locale === 'de' }">Deutsch</a></li>
                        <li><a @click="$locale('en')" :class="{ 'active': $locale === 'en' }">English</a></li>
                    </ul>
                </div>
                
                <!-- Theme toggle -->
                <button class="btn btn-ghost btn-circle">
                    <label class="swap swap-rotate">
                        <input type="checkbox" class="theme-controller" value="dark" />
                        <svg class="swap-on h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z"/>
                        </svg>
                        <svg class="swap-off h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z"/>
                        </svg>
                    </label>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main content -->
    <main class="container py-8">
        {{ template "content" . }}
    </main>

    <!-- Footer -->
    <footer class="footer footer-center p-4 bg-base-200 text-base-content">
        <div>
            <p x-text="$t('common.made_with')">Made with ❤️ using Go</p>
        </div>
    </footer>

    <!-- Application scripts (must be loaded before Alpine.js) -->
    {{ block "scripts" . }}{{ end }}

    <!-- Alpine.js must be loaded last -->
    <script defer src="/static/vendor/alpine.min.js"></script>
</body>
</html>
