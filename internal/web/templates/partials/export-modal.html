{{ define "export-modal" }}
<dialog id="export_modal" class="modal">
    <div class="modal-box">
        <h3 class="font-bold text-lg mb-4" x-text="$t('shift_plans.view.export_modal.title')"></h3>
        
        <!-- Error Display -->
        {{ template "error-display" "exportModal" }}
        
        <!-- Format Selection -->
        <div class="form-control w-full">
            <label class="label">
                <span class="label-text" x-text="$t('shift_plans.view.export_modal.format')"></span>
            </label>
            <select class="select select-bordered w-full" x-model="exportModal.exportFormat">
                <option value="json" x-text="$t('shift_plans.view.export_modal.format_json')"></option>
                <option value="vacancies" x-text="$t('shift_plans.view.export_modal.format_vacancies')"></option>
            </select>
        </div>

        <!-- Format Description -->
        <div class="mt-2">
            <p x-show="exportModal.exportFormat === 'json'" 
               class="text-sm text-base-content/70"
               x-text="$t('shift_plans.view.export_modal.format_json_description')"></p>
            <p x-show="exportModal.exportFormat === 'vacancies'" 
               class="text-sm text-base-content/70"
               x-text="$t('shift_plans.view.export_modal.format_vacancies_description')"></p>
        </div>

        <!-- Filter Checkbox -->
        <div class="form-control">
            <label class="label cursor-pointer justify-start gap-3">
                <input type="checkbox" class="checkbox" x-model="exportModal.useFilters">
                <span class="label-text" x-text="$t('shift_plans.view.export_modal.only_filtered')"></span>
            </label>
            <div x-show="exportModal.useFilters && activeFilterCount() > 0">
                <label class="label">
                    <span class="label-text-alt text-info">
                        <span x-text="activeFilterCount()"></span>
                        <span x-text="activeFilterCount() > 1 ? $t('shift_plans.view.export_modal.filters_active') : $t('shift_plans.view.export_modal.filter_active')"></span>
                    </span>
                </label>
            </div>
        </div>

        <!-- Loading State -->
        <div x-show="exportModal.isExporting" class="mt-4">
            <div class="flex items-center gap-3">
                <span class="loading loading-spinner"></span>
                <span x-text="$t('shift_plans.view.export_modal.generating')"></span>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="modal-action">
            <button class="btn" @click="closeExportModal()" x-text="$t('common.cancel')"></button>
            <button class="btn btn-primary" 
                    @click="downloadExport()" 
                    :disabled="exportModal.isExporting"
                    x-text="$t('shift_plans.view.export_modal.download')">
            </button>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button>close</button>
    </form>
</dialog>
{{ end }}
