{{ define "shift-join-modal" }}
<dialog id="join_modal" class="modal">
    <form method="dialog" class="modal-box" @submit.prevent="!joinNotice && joinModal.submit()">
        <h3 class="font-bold text-lg" x-text="$t('shift_plans.view.join_shift')"></h3>
        
        <!-- Shift became full or was deleted while the dialog is open -->
        <div x-show="joinNotice" class="mb-4">
            <div role="alert" class="alert alert-warning">
                <span x-text="noticeText(joinNotice)"></span>
            </div>
        </div>

        <!-- User-friendly Error Alert (ohne technische Details) -->
        <div x-show="joinModal.hasUserFriendlyError" class="mb-4">
            <div role="alert" class="alert alert-warning">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                <div>
                    <h3 class="font-bold" x-text="joinModal.userFriendlyErrorTitle"></h3>
                    <div class="text-sm" x-text="joinModal.userFriendlyErrorMessage"></div>
                </div>
            </div>
        </div>
        
        <!-- Technical Error Display -->
        {{ template "error-display" "joinModal" }}
        
        <!-- Step 1: name -->
        <div class="py-4" x-show="joinModal.step === 1">
            <div class="form-control w-full">
                <label class="label">
                    <span class="label-text" x-text="$t('shift_plans.view.enter_name')"></span>
                </label>
                <input type="text" x-model="joinModal.name" 
                       @change="joinModal.lookup()"
                       @keyup.enter="!joinNotice && joinModal.submit()"
                       class="input input-bordered w-full" 
                       :class="{ 'input-error': joinModal.errors.name }"
                       :placeholder="$t('shift_plans.view.name_placeholder')" />
                <label class="label" x-show="joinModal.errors.name">
                    <span class="label-text-alt text-error" x-text="joinModal.errors.name"></span>
                </label>
            </div>
            <button type="button" class="link link-hover text-sm min-h-11 mt-1"
                    x-show="joinModal.asksDetails && joinModal.known?.exists"
                    @click="joinModal.showDetails()" x-text="$t('shift_plans.view.join_edit_details')"></button>
        </div>

        <!-- Step 2: details the plan asks for -->
        <div class="py-4 space-y-3" x-show="joinModal.step === 2">
            <h4 class="font-medium" x-text="$t('shift_plans.view.join_your_details')"></h4>
            <template x-for="f in joinModal.participantFields" :key="f.id">
                <div>
                    <label class="flex flex-col gap-1" x-show="f.kind === 'choice'">
                        <span class="text-sm"><span x-text="fieldLabel(f)"></span><span x-show="f.required"> *</span></span>
                        <select class="select select-bordered w-full" x-model="joinModal.values[f.id]">
                            <option value="" x-text="$t('shift_plans.view.join_choose')"></option>
                            <template x-for="o in f.options" :key="o.id">
                                <option :value="o.id" x-text="optionLabel(o)"></option>
                            </template>
                        </select>
                    </label>
                    <label class="flex flex-col gap-1" x-show="f.kind === 'number'">
                        <span class="text-sm"><span x-text="fieldLabel(f)"></span><span x-show="f.required"> *</span></span>
                        <input type="number" step="0.1" class="input input-bordered w-full" x-model.number="joinModal.values[f.id]">
                    </label>
                    <label class="flex items-center gap-2 min-h-11 cursor-pointer" x-show="f.kind === 'boolean'">
                        <input type="checkbox" class="checkbox checkbox-sm" x-model="joinModal.values[f.id]">
                        <span><span x-text="fieldLabel(f)"></span><span x-show="f.required"> *</span></span>
                    </label>
                    <label class="flex flex-col gap-1" x-show="f.kind === 'text'">
                        <span class="text-sm"><span x-text="fieldLabel(f)"></span><span x-show="f.required"> *</span></span>
                        <input type="text" maxlength="200" class="input input-bordered w-full" x-model="joinModal.values[f.id]" autocomplete="off">
                    </label>
                </div>
            </template>
            <template x-if="joinModal.asksAttendance">
                <div class="space-y-3">
                    <label class="flex flex-col gap-1">
                        <span class="text-sm" x-text="$t('coord.present_from')"></span>
                        <input type="datetime-local" class="input input-bordered w-full" x-model="joinModal.from">
                    </label>
                    <label class="flex flex-col gap-1">
                        <span class="text-sm" x-text="$t('coord.present_until')"></span>
                        <input type="datetime-local" class="input input-bordered w-full" x-model="joinModal.until">
                    </label>
                </div>
            </template>
            <p class="text-sm text-error" x-show="joinModal.errors.details" x-text="joinModal.errors.details"></p>
        </div>
        <div class="modal-action">
            <button type="button" @click="joinModal.close()" class="btn" x-show="joinModal.step === 1" x-text="$t('common.cancel')"></button>
            <button type="button" @click="joinModal.backToName()" class="btn" x-show="joinModal.step === 2" x-text="$t('coord.back')"></button>
            <button type="submit" class="btn btn-success" :disabled="!!joinNotice" x-text="$t('shift_plans.view.join')"></button>
        </div>
    </form>
    <form method="dialog" class="modal-backdrop">
        <button @click="joinModal.close()">close</button>
    </form>
</dialog>
{{ end }}
