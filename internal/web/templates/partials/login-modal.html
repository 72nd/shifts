{{ define "login-modal" }}
<!-- Admin Login Modal -->
<dialog id="admin_modal" class="modal">
    <div class="modal-box">
        <h3 class="font-bold text-lg" x-text="$t('shift_plans.view.admin_login')"></h3>
        
        <!-- User-friendly Error Alert (ohne technische Details) -->
        <div x-show="adminModal.hasUserFriendlyError" class="mb-4">
            <div role="alert" class="alert alert-warning">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                <div>
                    <h3 class="font-bold" x-text="adminModal.userFriendlyErrorTitle"></h3>
                    <div class="text-sm" x-text="adminModal.userFriendlyErrorMessage"></div>
                </div>
            </div>
        </div>
        
        <!-- Technical Error Display -->
        {{ template "error-display" "adminModal" }}
        
        <div class="py-4">
            <div class="form-control w-full">
                <label class="label">
                    <span class="label-text" x-text="$t('shift_plans.view.admin_password')"></span>
                </label>
                <input type="password" 
                       x-model="adminModal.password" 
                       @keyup.enter="adminModal.submit()"
                       class="input input-bordered w-full" 
                       :class="{ 'input-error': adminModal.errors.password }"
                       :placeholder="$t('shift_plans.view.admin_password_placeholder')" />
                <label class="label" x-show="adminModal.errors.password">
                    <span class="label-text-alt text-error" x-text="adminModal.errors.password"></span>
                </label>
            </div>
        </div>
        <div class="modal-action">
            <button type="button" @click="adminModal.close()" class="btn" x-text="$t('common.cancel')"></button>
            <button type="submit" @click="adminModal.submit()" class="btn btn-primary" x-text="$t('shift_plans.view.login')"></button>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button @click="adminModal.close()">close</button>
    </form>
</dialog>
{{ end }}
